[package]
name = "clutch-sbf-operatord"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Release-bound chain index, transaction construction, and local-infrastructure daemon"

# Intentionally NOT a member of the SBF build workspace, for the reason
# `../committed-harness/README.md` already records: the program ELF must not
# acquire host signing or JSON dependencies merely because a local evidence
# daemon needs them.  That workspace's lock is what the sealed baseline
# resolves the deployable artifact from.  This crate path-depends across the
# boundary so it still calls the one true builder.
[workspace]

# Same offline build plumbing as the SBF workspace, and for the same reason:
# this host has the `solana-define-syscall 5.1.0` source but not its `.crate`
# archive.  The patched source is byte-identical to the published crate.
[patch.crates-io]
solana-define-syscall = { path = "../vendor/solana-define-syscall-5.1.0" }

[dependencies]
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
solana-keypair = "=3.1.2"
# The one true builder.  Every byte this daemon submits, and every byte it
# rebuilds in `replay`, comes from here.
clutch-sbf-harness = { path = "../harness" }
# The frozen account codecs the daemon decodes observed bytes through, so the
# browser is shown decoded state rather than a second hand-written parser.
clutch-solana-layout = { path = "../../solana-layout" }
# The program's seeds, loader state, and account-count contracts.
clutch-sbf = { path = "../program" }
# Host-only typed construction for chain-derived operator workflows. This
# crate never enters the SBF artifact; no browser-authored protocol bytes or
# account-role vectors cross this boundary.
clutch-local-real-pyth = { path = "../local-real-pyth", default-features = false, features = ["builder", "operator"] }
# Pure, offline Product payoff compilation. These remain host-only dependencies:
# the daemon accepts exact rational JSON and emits canonical Product artifacts,
# but owns no account, signer, RPC client, or registration authority.
clutch-bspline-shape-compiler = { path = "../../../research/bspline-shape-compiler" }
clutch-bspline = { path = "../../../crates/clutch-bspline" }
clutch-product-series = { path = "../../../crates/clutch-product-series" }
clutch-source-plane-v3-runtime = { path = "../../../crates/clutch-source-plane-v3-runtime" }
num-bigint = "0.4.6"
num-rational = "0.4.2"
solana-address = { version = "=2.6.1", features = ["curve25519"] }
# Hashing the ELF the validator is actually about to load, in process, so the
# banner cannot show a digest a stale manifest remembers.  Same pin and same
# host-only `sha2` selection the harness uses.
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }
# Bounded, read-only processed subscription transport. The transport owns one
# ordered WebSocket reader and never exposes signing or submission primitives.
tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
