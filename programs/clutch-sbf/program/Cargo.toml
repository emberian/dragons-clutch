[package]
name = "clutch-sbf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Bring-up native SBF program exposing exactly one Dragon's Clutch instruction"

[lib]
name = "clutch_sbf"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
# Cargo also exposes the named `default` marker to rustc.  Explicit full-profile
# builds must retain that marker (`--no-default-features --features
# custom-heap,default,profile-full`) to preserve the Cargo-default crate and ELF
# identity; see docs/reviews/DEFAULT_EXPLICIT_ELF_IDENTITY_AUDIT_2026-08-23.md.
default = ["custom-heap", "profile-full"]
# Suppresses the Anza `entrypoint!` macro's 32-KiB downward bump allocator so
# the `bpf` module can install the upward allocator that reaches a
# transaction-requested heap frame (up to 256 KiB).  A feature only because
# that is the macro's suppression mechanism; it is always on.
custom-heap = []
# Changes the program ELF by registering one deterministic laboratory source
# parser/deployment pair. Never use for a production deployment or attribute
# its SVM evidence to the default artifact.
non-production-mock-source = []
# Registers the byte-pinned Pyth receiver deployment used only by the local
# real-program campaign. The observation carried by that campaign is locally
# signed synthetic data, never devnet or production price evidence.
non-production-real-pyth-lab = []
# Exposes `source_v2::fixtures`, the byte-accurate builders for the fabricated
# provider accounts (receiver program, ProgramData, `Config`, `PriceUpdateV2`,
# Instructions sysvar). Host-only by construction and never enabled for a
# deployed artifact: `run_svm_tests.sh` builds the ELF without it, and an ELF
# that could *write* a provider account would be a different artifact from one
# that can only read one. The builders exist so a bank campaign exercises the
# real decoders at the real offsets instead of a convenient parallel encoding.
laboratory-fixtures = []
# Selects a separately reviewed, checked-in collateral release manifest whose
# rows bind an observed positive-slot Upgradeable Loader deployment. The
# repository manifest is intentionally empty until exact cluster observations
# and ELF digests are committed; it never accepts build-time environment rows.
observed-positive-collateral-release-manifest = []
# Enables the non-activating Product/Series artifact-catalog laboratory. It can
# publish exact successor artifacts, including immutable funding-requirement
# bodies, but deliberately cannot register a Series or create an occurrence.
non-production-product-series-lab = [
    "clutch-solana-layout/non-production-product-series-lab",
]
# Compiles only the withdrawn occurrence-scoped Recovery78/v1 archaeology
# adapter. Current Market-scoped Failure owners and their checked-disabled V2
# contract are always compiled and never depend on this feature.
non-production-failure-recovery-lab = [
    "dep:clutch-evidence-recovery",
    "dep:clutch-failure-policy-adapter",
]
# Mutually exclusive deployable products. Each forwards the same identity to
# both hostile wire crates so a narrow SBF cannot accidentally link the full
# Intent decoder through a dependency's default features.
profile-full = [
    "dep:clutch-general-v2-runtime",
    "clutch-general-v2-runtime/layout-profile-full",
    "clutch-solana-layout/profile-full",
    "clutch-solana-reference/profile-full",
]
profile-direct-v3-source-v2-point = [
    "clutch-solana-layout/profile-direct-v3-source-v2-point",
    "clutch-solana-reference/profile-direct-v3-source-v2-point",
]
profile-general-source-v2-point = [
    "clutch-solana-layout/profile-general-source-v2-point",
    "clutch-solana-reference/profile-general-source-v2-point",
]
# The sole successor-development product. This compiles the broad current
# substrate plus every optional successor-family adapter under one selector;
# central capability admission remains fail-closed until the exact all-family
# closure and populated observed-positive collateral/claim manifests land.
# Per-family laboratory features are not dependencies of this profile.
profile-successor-chain-attached-dev = [
    "profile-full",
    "dep:clutch-fee-runtime-contract",
    "dep:clutch-evidence-recovery",
    "dep:clutch-failure-policy-adapter",
    "dep:clutch-failure-policy-runtime",
    "dep:clutch-structured-claim",
    "dep:clutch-structured-claim-adapter",
    "clutch-structured-claim-adapter/profile-successor-chain-attached-dev",
    "clutch-solana-layout/profile-successor-chain-attached-dev",
    "clutch-solana-reference/profile-successor-chain-attached-dev",
    "observed-positive-collateral-release-manifest",
]
# A distinct non-production Dealer product containing the immutable policy and
# liveness catalogs plus exact facility Initialize and BindEpoch transitions. The hostile
# wire dependencies use their full decoders, while this crate's capability
# table rejects every legacy and incomplete Dealer action before accounts. It
# must never be combined with another profile.
profile-non-production-dealer-policy-catalog-lab = [
    "dep:clutch-fee-runtime-contract",
    "dep:clutch-general-v2-runtime",
    "clutch-general-v2-runtime/layout-profile-general",
    "profile-full",
]
# A deliberately non-production product whose only successes are the twelve
# General V2 empty-book identity actions.  The dependency profiles provide the
# narrow legacy codec substrate; this crate's capability table still rejects
# every legacy action before account inspection.
profile-non-production-general-v2-empty-book-identity-lab = [
    "dep:clutch-fee-runtime-contract",
    "dep:clutch-general-v2-runtime",
    "clutch-general-v2-runtime/layout-profile-general",
    "clutch-solana-layout/profile-general-source-v2-point",
    "clutch-solana-reference/profile-general-source-v2-point",
]

[dependencies]
# The window/summary algebra the observation and resolution plane folds
# hostile observation bytes through.  It is already in the graph through
# `clutch-solana-reference`, which re-exports only `WindowError`; naming it
# here is what lets `instructions::observe_resolve` drive `WindowAccumulator`
# and `Summary` directly instead of re-deriving their algebra.
clutch-accumulator = { path = "../../../crates/clutch-accumulator" }
clutch-batch = { path = "../../../crates/clutch-batch" }
clutch-bspline = { path = "../../../crates/clutch-bspline" }
clutch-bspline-accumulator = { path = "../../../crates/clutch-bspline-accumulator" }
clutch-batch-policy-identity = { path = "../../../research/batch-policy-identity" }
clutch-collateral-adapter-v2 = { path = "../../../crates/clutch-collateral-adapter-v2" }
clutch-evidence-recovery = { path = "../../../crates/clutch-evidence-recovery", optional = true }
clutch-failure-policy-adapter = { path = "../../../crates/clutch-failure-policy-adapter", optional = true }
clutch-failure-policy-runtime = { path = "../../../crates/clutch-failure-policy-runtime" }
clutch-fractional-redemption-runtime = { path = "../../../crates/clutch-fractional-redemption-runtime" }
clutch-kernel = { path = "../../../crates/clutch-kernel" }
clutch-dealer-runtime-contract = { path = "../../../crates/clutch-dealer-runtime-contract" }
clutch-direct-market-runtime = { path = "../../../crates/clutch-direct-market-runtime" }
clutch-fee-runtime-contract = { path = "../../../crates/clutch-fee-runtime-contract", optional = true }
clutch-general-v2-contract = { path = "../../../crates/clutch-general-v2-contract" }
clutch-general-v2-runtime = { path = "../../../crates/clutch-general-v2-runtime", default-features = false, optional = true }
clutch-owner-settlement = { path = "../../../crates/clutch-owner-settlement" }
clutch-retirement = { path = "../../../crates/clutch-retirement" }
clutch-price-measure = { path = "../../../crates/clutch-price-measure" }
clutch-product-series = { path = "../../../crates/clutch-product-series" }
clutch-pyth-parser-v1 = { path = "../../../crates/clutch-pyth-parser-v1" }
# The liveness kernel's `TreasuryServiceLedger` — the B4b mid-epoch-close
# grief rider as fixed-memory bookkeeping.  Already in the graph through
# `clutch-batch-policy-identity`; naming it here is what lets
# `orders_batch::terminal_closure` drive the ledger's begin/settle/close
# transitions from the Position close route instead of restating them.
clutch-liveness = { path = "../../../crates/clutch-liveness" }
clutch-source-plane-v3 = { path = "../../../crates/clutch-source-plane-v3" }
clutch-source-plane-v3-adapter = { path = "../../../crates/clutch-source-plane-v3-adapter" }
clutch-source-plane-v3-runtime = { path = "../../../crates/clutch-source-plane-v3-runtime" }
clutch-structured-claim = { path = "../../../crates/clutch-structured-claim", optional = true }
clutch-structured-claim-adapter = { path = "../../structured-claim-adapter", default-features = false, features = ["profile-full"], optional = true }
clutch-solana-layout = { path = "../../solana-layout", default-features = false }
clutch-solana-reference = { path = "../../solana-reference", default-features = false }
solana-account-info = "=3.1.1"
solana-clock = { version = "=3.1.1", default-features = false, features = [
    "sysvar",
] }
solana-get-sysvar = "=1.0.0"

# Cross-program invocation, added by the Token-2022 lane.  Both resolve from
# this host's offline cache and both survive `cargo-build-sbf`, which resolves
# for every platform: `solana-cpi` pulls `solana-stable-layout` and
# `solana-define-syscall 4.0.1` only under `target_os = "solana"`, and every one
# of those has a `.crate` archive here.  Note that `solana-define-syscall 4.0.1`
# coexists with the vendored 5.1.0 the workspace patch supplies for
# `solana-address`; they are semver-incompatible and both are in the graph.
solana-cpi = "=3.1.0"
solana-instruction = { version = "=3.4.1", default-features = false, features = [
    "std",
] }
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
# Safe wrapper over Solana's native SHA-256 syscall. Artifact sealing hashes
# canonical staged bytes onchain; using the runtime primitive avoids both an
# unsafe first-party syscall boundary and the prohibitive compute cost of the
# dependency-free software hasher used by the portable layout crate.
solana-sha256-hasher = { version = "=3.1.0", default-features = false, features = [
    "sha2",
] }
solana-sdk-ids = "=3.1.0"

# `solana-pubkey` is taken with default features off on every target.  Under
# `target_os = "solana"` program-address derivation is a runtime syscall and
# needs no extra dependency.  The host-side `curve25519` backend is
# deliberately NOT enabled: its proc-macro dependency
# (`curve25519-dalek-derive`) has no `.crate` archive in this host's offline
# cache, and enabling it makes `cargo metadata` -- which `cargo-build-sbf` runs
# for every target -- fail offline.  See `seeds::find` and
# `docs/implementation/SBF_BRINGUP.md`.
solana-pubkey = { version = "=4.2.0", default-features = false }

# Transitive pin, declared directly so the version is visible and reviewable.
# `solana-address` requires `solana-define-syscall ^5.1.0`; the offline crate
# source on this host holds 5.1.0 but not the newer 5.2.0 the resolver would
# otherwise pick.  The dependency is used only through `solana-address`.
solana-define-syscall = "=5.1.0"

[dev-dependencies]
# Program host tests retain hostile fixtures for the withdrawn General V3
# wires. The layout crate itself compile-refuses this decoder on Solana.
clutch-solana-layout = { path = "../../solana-layout", default-features = false, features = [
    "non-production-legacy-general-v3-hostile-decode",
] }

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(target_os, values("solana"))',
    # Emitted by the Anza `entrypoint!` macro expansion, not by this crate.
    'cfg(feature, values("custom-heap", "custom-panic"))',
]
