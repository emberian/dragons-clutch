[workspace]

[patch.crates-io]
solana-define-syscall = { path = "../vendor/solana-define-syscall-5.1.0" }

[package]
name = "clutch-local-real-pyth"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Fail-closed SourceSeries operator construction with an opt-in local Pyth laboratory"

[features]
default = ["operator"]
builder = ["dep:solana-keypair"]
operator = ["dep:base64", "dep:serde", "dep:serde_json", "dep:solana-rent"]
campaign = [
  "dep:clutch-sbf",
  "dep:clutch-sbf-svm-tests",
  "clutch-sbf/laboratory-fixtures",
  "clutch-sbf/non-production-real-pyth-lab",
  "dep:base64",
  "dep:borsh",
  "dep:byteorder",
  "dep:libsecp256k1",
  "dep:pyth-solana-receiver-sdk",
  "dep:pythnet-sdk",
  "dep:serde",
  "dep:serde_json",
  "dep:serde_wormhole",
  "dep:solana-account",
  "dep:solana-clock",
  "dep:solana-hash",
  "dep:solana-keypair",
  "dep:solana-rent",
  "dep:solana-sha256-hasher",
  "dep:solana-signer",
  "dep:solana-system-interface",
  "dep:wormhole-sdk",
]

[[bin]]
name = "clutch-local-real-pyth"
path = "src/main.rs"
required-features = ["campaign"]

[dependencies]
clutch-sbf = { path = "../program", default-features = false, features = ["profile-full"], optional = true }
clutch-sbf-svm-tests = { path = "../svm-tests", features = ["non-production-real-pyth-lab"], optional = true }
clutch-batch = { path = "../../../crates/clutch-batch" }
clutch-batch-policy-identity = { path = "../../../research/batch-policy-identity" }
clutch-client-contract = { path = "../../../crates/clutch-client-contract" }
clutch-collateral-adapter-v2 = { path = "../../../crates/clutch-collateral-adapter-v2" }
clutch-dealer-runtime-contract = { path = "../../../crates/clutch-dealer-runtime-contract" }
clutch-direct-market-runtime = { path = "../../../crates/clutch-direct-market-runtime" }
clutch-failure-policy-runtime = { path = "../../../crates/clutch-failure-policy-runtime" }
clutch-fractional-redemption-runtime = { path = "../../../crates/clutch-fractional-redemption-runtime" }
clutch-general-v2-contract = { path = "../../../crates/clutch-general-v2-contract" }
clutch-kernel = { path = "../../../crates/clutch-kernel" }
clutch-liveness = { path = "../../../crates/clutch-liveness" }
clutch-owner-settlement = { path = "../../../crates/clutch-owner-settlement" }
clutch-product-series = { path = "../../../crates/clutch-product-series" }
clutch-retirement = { path = "../../../crates/clutch-retirement" }
clutch-solana-layout = { path = "../../solana-layout" }
clutch-solana-reference = { path = "../../solana-reference" }
clutch-source-plane-v3-adapter = { path = "../../../crates/clutch-source-plane-v3-adapter" }
clutch-source-plane-v3-runtime = { path = "../../../crates/clutch-source-plane-v3-runtime" }
clutch-source-plane-v3 = { path = "../../../crates/clutch-source-plane-v3" }
clutch-structured-claim-runtime-contract = { path = "../../../crates/clutch-structured-claim-runtime-contract" }
clutch-structured-claim-adapter = { path = "../../structured-claim-adapter", default-features = false }
clutch-structured-claim = { path = "../../../crates/clutch-structured-claim" }

# Exact released host SDKs matching the pinned pyth-crosschain capture. The
# deployed programs themselves are never rebuilt from these crates: the runner
# loads the SHA-pinned captured Program/ProgramData bodies.
pythnet-sdk = { version = "=3.0.0", features = ["test-utils"], optional = true }
pyth-solana-receiver-sdk = { version = "=2.0.0", features = ["pro-compatible"], optional = true }
wormhole-sdk = { package = "wormhole-vaas-serde", version = "=0.1.0", optional = true }
serde_wormhole = { version = "=0.1.0", optional = true }
libsecp256k1 = { version = "=0.7.1", optional = true }

borsh = { version = "=1.5.7", optional = true }
byteorder = { version = "=1.5.0", optional = true }
base64 = { version = "=0.22.1", optional = true }
bincode = "=1.3.3"
serde = { version = "=1.0.228", features = ["derive"], optional = true }
serde_json = { version = "=1.0.151", optional = true }
sha2 = "=0.10.9"

# Same coherent host transaction stack as svm-tests/devnet-paces.
solana-account = { version = "=4.3.2", optional = true }
solana-address = { version = "=2.6.1", features = ["curve25519"] }
solana-clock = { version = "=3.1.1", features = ["serde"], optional = true }
solana-hash = { version = "=4.5.0", optional = true }
solana-instruction = "=3.4.1"
solana-keypair = { version = "=3.1.2", optional = true }
solana-message = { version = "=4.4.1", features = ["serde"] }
solana-rent = { version = "=4.3.0", features = ["serde"], optional = true }
solana-sdk-ids = "=3.1.0"
solana-signer = { version = "=3.0.1", optional = true }
solana-system-interface = { version = "=3.2.0", features = ["bincode"], optional = true }
solana-transaction = { version = "=4.1.6", features = ["blake3", "serde"] }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"], optional = true }

[lints.rust]
unsafe_code = "forbid"
