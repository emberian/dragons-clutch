[workspace]

[patch.crates-io]
solana-define-syscall = { path = "../vendor/solana-define-syscall-5.1.0" }

[package]
name = "clutch-local-real-pyth"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "NON-PRODUCTION synthetic local-only signed-RPC Pyth-to-Clutch campaign"

[[bin]]
name = "clutch-local-real-pyth"
path = "src/main.rs"

[dependencies]
clutch-sbf = { path = "../program", features = ["laboratory-fixtures", "non-production-real-pyth-lab"] }
clutch-sbf-svm-tests = { path = "../svm-tests", features = ["non-production-real-pyth-lab"] }
clutch-batch = { path = "../../../crates/clutch-batch" }
clutch-batch-policy-identity = { path = "../../../research/batch-policy-identity" }
clutch-kernel = { path = "../../../crates/clutch-kernel" }
clutch-solana-layout = { path = "../../solana-layout" }
clutch-solana-reference = { path = "../../solana-reference" }

# Exact released host SDKs matching the pinned pyth-crosschain capture. The
# deployed programs themselves are never rebuilt from these crates: the runner
# loads the SHA-pinned captured Program/ProgramData bodies.
pythnet-sdk = { version = "=3.0.0", features = ["test-utils"] }
pyth-solana-receiver-sdk = { version = "=2.0.0", features = ["pro-compatible"] }
wormhole-sdk = { package = "wormhole-vaas-serde", version = "=0.1.0" }
serde_wormhole = "=0.1.0"
libsecp256k1 = "=0.7.1"

borsh = "=1.5.7"
byteorder = "=1.5.0"
base64 = "=0.22.1"
bincode = "=1.3.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"

# Same coherent host transaction stack as svm-tests/devnet-paces.
solana-account = "=4.3.2"
solana-address = { version = "=2.6.1", features = ["curve25519"] }
solana-clock = { version = "=3.1.1", features = ["serde"] }
solana-hash = "=4.5.0"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-rent = "=4.3.0"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.6", features = ["blake3", "serde"] }
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[lints.rust]
unsafe_code = "forbid"
