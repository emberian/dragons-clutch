# SVM tests for the Dragon's Clutch Token-2022 leg.
#
# A standalone workspace, deliberately.  Two things make it impossible for
# these tests to live beside the program they drive:
#
#   * the Agave 4.2.1 runtime needs Rust >= 1.93 and `programs/clutch-sbf` is
#     built by the 1.89.0 host pin and by `cargo-build-sbf`; and
#   * `cargo-build-sbf` resolves the program's graph for every platform and
#     needs a `.crate` archive for every package in it, which a 731-package
#     Agave graph does not have on this host.
#
# See `docs/implementation/TOKEN2022_PLAN.md` §1.2.  The same separation
# `toolchain/probes/token2022` already maintains, for the same reason.
#
# What this drives is the **real program ELF**, built by `cargo-build-sbf`, and
# the **real Token-2022 program**, installed at genesis by
# `solana-program-test`.  Nothing here is a model of either.
[workspace]

[patch.crates-io]
solana-define-syscall = { path = "../vendor/solana-define-syscall-5.1.0" }

[package]
name = "clutch-sbf-svm-tests"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Program-test scenarios driving the clutch-sbf ELF against real Token-2022"

[lib]
name = "clutch_svm_fixture"
path = "src/lib.rs"

[features]
default = ["profile-full"]
# Keep the historical default test graph byte-for-byte on the full product,
# while permitting one explicitly selected mutually exclusive lab ELF.
profile-full = [
    "clutch-sbf/profile-full",
    "clutch-solana-layout/profile-full",
    "clutch-solana-reference/profile-full",
]
profile-non-production-general-v2-empty-book-identity-lab = [
    "clutch-sbf/profile-non-production-general-v2-empty-book-identity-lab",
    "clutch-solana-layout/profile-general-source-v2-point",
    "clutch-solana-reference/profile-general-source-v2-point",
]
# Withdrawn compatibility selector. Forwarding it makes both harness and
# program fail closed with the program's explicit compile-time refusal.
non-production-mock-source = ["profile-full", "clutch-sbf/non-production-mock-source"]
# Compiles the explicit local-real Pyth release row and its SVM campaign. This
# is a different, non-production ELF identity; the default registry is unchanged.
non-production-real-pyth-lab = ["clutch-sbf/non-production-real-pyth-lab"]
# Distinct real-ELF profile for the immutable Dealer-policy catalog only.
profile-non-production-dealer-policy-catalog-lab = [
    "clutch-sbf/profile-non-production-dealer-policy-catalog-lab",
]
# Builds the separate Product/Series account-boundary ELF. All recurring-Series
# extension actions remain capability-disabled.
non-production-product-series-lab = [
    "clutch-sbf/non-production-product-series-lab",
    "clutch-solana-layout/non-production-product-series-lab",
]

[dependencies]
# The frozen byte layouts and the reference-only codecs.  Both are
# dependency-free pure Rust, so pulling them into a 1.93 workspace costs
# nothing and — this is the point — the account bytes this harness writes at
# genesis come from the *same* encoders the program decodes with.  A hand-rolled
# second copy would test the copy.
clutch-dealer-runtime-contract = { path = "../../../crates/clutch-dealer-runtime-contract" }
clutch-collateral-adapter-v2 = { path = "../../../crates/clutch-collateral-adapter-v2" }
clutch-sbf = { path = "../program", default-features = false, features = ["custom-heap", "laboratory-fixtures"] }
# The checkpoint's owning crate: the idle body the final grow writes on-chain
# is compared byte-for-byte against `ClearWorkV1::encode_idle_into` here, so
# the account image and the host image share one writer.
clutch-batch = { path = "../../../crates/clutch-batch" }
clutch-batch-policy-identity = { path = "../../../research/batch-policy-identity" }
clutch-kernel = { path = "../../../crates/clutch-kernel" }
clutch-solana-layout = { path = "../../solana-layout", default-features = false }
clutch-solana-reference = { path = "../../solana-reference", default-features = false }
clutch-general-v2-contract = { path = "../../../crates/clutch-general-v2-contract" }
clutch-price-measure = { path = "../../../crates/clutch-price-measure" }
clutch-product-series = { path = "../../../crates/clutch-product-series" }

# `curve25519` is what makes off-chain `find_program_address` available at all.
# `programs/clutch-sbf` deliberately cannot enable it (its proc-macro dependency
# has no archive in this host's offline cache and `cargo-build-sbf` runs
# `cargo metadata` for every target), which is why `crate::seeds::find` is
# `unimplemented!()` off-chain.  Here it resolves.
solana-address = { version = "=2.6.1", features = ["curve25519"] }
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
spl-token-2022-interface = "=3.1.1"

[dev-dependencies]
solana-account = "=4.3.2"
solana-clock = "=3.1.1"
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
# The entire `solana-program-test` API sits behind `agave-unstable-api`.  Anza's
# name for the feature is a stability warning and should be read as one: this is
# acceptable for a test harness and would not be acceptable for anything that
# ships.  `TOKEN2022_PLAN.md` open decision 2.
solana-program-test = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-rent = "=4.3.0"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = "=4.1.6"
solana-transaction-error = "=3.3.2"
