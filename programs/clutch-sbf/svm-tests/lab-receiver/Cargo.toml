# A laboratory stand-in for the Pyth pull receiver.
#
# Its own workspace, with only the split Solana entrypoint/account crates. It
# cannot touch the program under test, and every dependency resolves from the
# same offline cache used by the real program build.
#
# What it stands in for is narrow and it is worth being exact about. The v2
# pull authentication join never trusts the receiver's *behaviour*. This lab
# program nevertheless writes the canonical 134-byte update in the preceding
# instruction so the bank campaign proves the real transaction seam instead
# of consuming host-preinstalled evidence.
[workspace]

[package]
name = "clutch-lab-receiver"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Laboratory receiver writer for the R2 pull adjacency plane"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-account-info = "=3.1.1"
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-pubkey = { version = "=4.2.0", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
]
