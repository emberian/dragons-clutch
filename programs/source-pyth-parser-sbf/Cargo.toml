[workspace]

[patch.crates-io]
solana-define-syscall = { path = "../clutch-sbf/vendor/solana-define-syscall-5.1.0" }

[package]
name = "clutch-source-pyth-parser-sbf"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Reviewed read-only Pyth PriceUpdateV2 parser for Dragon's Clutch Source V3"

[lib]
name = "clutch_source_pyth_parser_sbf"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[dependencies]
clutch-pyth-parser-v1 = { path = "../../crates/clutch-pyth-parser-v1" }
clutch-source-plane-v3 = { path = "../../crates/clutch-source-plane-v3" }
clutch-source-plane-v3-runtime = { path = "../../crates/clutch-source-plane-v3-runtime" }
clutch-source-profile-v1 = { path = "../../research/source-profile-v1" }
solana-account-info = "=3.1.1"
solana-clock = { version = "=3.1.1", default-features = false, features = ["sysvar"] }
solana-cpi = "=3.1.0"
solana-get-sysvar = "=1.0.0"
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-pubkey = { version = "=4.2.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
]
