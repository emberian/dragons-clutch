[package]
name = "dclutch-direct-aot-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Stateless SBF accelerator for the Lean-owned Direct V2 descriptor"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-direct-aot-contract = { path = "../../crates/dclutch-direct-aot-contract" }
dclutch-execution-strategy-contract = { path = "../../crates/dclutch-execution-strategy-contract" }
solana-program = { version = "=3.0.0", default-features = false }

[dev-dependencies]
solana-hash = "=4.5.0"
solana-message = "=4.4.1"
solana-program-test = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-transaction = "=4.1.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
