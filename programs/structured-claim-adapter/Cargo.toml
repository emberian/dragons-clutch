[package]
name = "clutch-structured-claim-adapter"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Fixed-layout Solana adapter seam for Dragon's Clutch structured claims"

[lib]
path = "src/lib.rs"

[features]
default = ["profile-full"]
profile-full = [
    "clutch-retirement-adapter/profile-full",
    "clutch-solana-layout/profile-full",
    "clutch-solana-reference/profile-full",
]
profile-direct-v3-source-v2-point = [
    "clutch-retirement-adapter/profile-direct-v3-source-v2-point",
    "clutch-solana-layout/profile-direct-v3-source-v2-point",
    "clutch-solana-reference/profile-direct-v3-source-v2-point",
]
profile-general-source-v2-point = [
    "clutch-retirement-adapter/profile-general-source-v2-point",
    "clutch-solana-layout/profile-general-source-v2-point",
    "clutch-solana-reference/profile-general-source-v2-point",
]
# Activates current Structured construction and wrap/unwind actions 1..=5 for
# the separately deployed non-production wrapper ELF.
live-current-wrapper = []

[dependencies]
clutch-collateral-adapter-v2 = { path = "../../crates/clutch-collateral-adapter-v2" }
clutch-general-v2-contract = { path = "../../crates/clutch-general-v2-contract" }
clutch-kernel = { path = "../../crates/clutch-kernel" }
clutch-owner-settlement = { path = "../../crates/clutch-owner-settlement" }
clutch-product-series = { path = "../../crates/clutch-product-series" }
clutch-retirement = { path = "../../crates/clutch-retirement" }
clutch-retirement-adapter = { path = "../../crates/clutch-retirement-adapter", default-features = false }
clutch-solana-layout = { path = "../solana-layout", default-features = false }
clutch-solana-reference = { path = "../solana-reference", default-features = false }
clutch-structured-claim = { path = "../../crates/clutch-structured-claim" }
clutch-structured-claim-runtime-contract = { path = "../../crates/clutch-structured-claim-runtime-contract" }

[target.'cfg(not(target_os = "solana"))'.dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[target.'cfg(target_os = "solana")'.dependencies]
solana-pubkey = { version = "=4.2.0", default-features = false }
solana-sha256-hasher = { version = "=3.1.0", default-features = false }

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(target_os, values("solana"))']
