[package]
name = "dclutch-controller-proof-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authority-membrane SBF experiment for a dClutch semantic controller"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-direct-codec = { path = "../../crates/dclutch-direct-codec" }
dclutch-token-svm = { path = "../../crates/dclutch-token-svm" }
dclutch-transition-vm = { path = "../../crates/dclutch-transition-vm" }
solana-program = { version = "=3.0.0", default-features = false }
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"

[lints]
workspace = true
