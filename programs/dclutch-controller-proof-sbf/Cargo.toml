[package]
name = "dclutch-controller-proof-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Authority-membrane SBF experiment for a dClutch semantic controller"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
solana-program = { version = "=3.0.0", default-features = false }

[lints]
workspace = true
