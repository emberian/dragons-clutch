[workspace]

[patch.crates-io]
solana-define-syscall = { path = "../clutch-sbf/vendor/solana-define-syscall-5.1.0" }

[package]
name = "clutch-structured-claim-sbf"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Separately deployed Token-2022 wrapper for Dragon's Clutch structured claims"

[lib]
name = "clutch_structured_claim_sbf"
path = "src/lib.rs"
crate-type = ["cdylib", "lib"]

[features]
default = ["custom-heap", "non-production-live-canonical"]
custom-heap = []
non-production-live-canonical = []

[dependencies]
clutch-product-series = { path = "../../crates/clutch-product-series" }
clutch-retirement = { path = "../../crates/clutch-retirement" }
clutch-solana-layout = { path = "../solana-layout", default-features = false, features = ["profile-full"] }
clutch-solana-reference = { path = "../solana-reference", default-features = false, features = ["profile-full"] }
clutch-structured-claim = { path = "../../crates/clutch-structured-claim" }
clutch-structured-claim-adapter = { path = "../structured-claim-adapter", default-features = false, features = ["profile-full", "live-canonical-wrapper"] }
clutch-structured-claim-runtime-contract = { path = "../../crates/clutch-structured-claim-runtime-contract" }
solana-account-info = "=3.1.1"
solana-cpi = "=3.1.0"
solana-instruction = { version = "=3.4.1", default-features = false, features = ["std"] }
solana-program-entrypoint = "=3.1.1"
solana-program-error = "=3.0.1"
solana-pubkey = { version = "=4.2.0", default-features = false }
solana-rent = "=3.1.0"
solana-sdk-ids = "=3.1.0"
solana-sha256-hasher = { version = "=3.1.0", default-features = false, features = ["sha2"] }
solana-sysvar = { version = "=3.1.1", features = ["bincode"] }
solana-define-syscall = "=5.1.0"

[profile.release]
lto = "fat"
codegen-units = 1
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("custom-heap", "custom-panic"))',
]
