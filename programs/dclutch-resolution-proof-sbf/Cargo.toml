[package]
name = "dclutch-resolution-proof-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Small Registry-bound Pyth Resolution controller for the dClutch successor"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-market-contract = { path = "../../crates/dclutch-market-contract" }
dclutch-product-contract = { path = "../../crates/dclutch-product-contract" }
dclutch-pyth-svm = { path = "../../crates/dclutch-pyth-svm" }
dclutch-record-contract = { path = "../../crates/dclutch-record-contract" }
dclutch-registry-contract = { path = "../../crates/dclutch-registry-contract" }
dclutch-release-set-contract = { path = "../../crates/dclutch-release-set-contract" }
dclutch-resolution-codec = { path = "../../crates/dclutch-resolution-codec" }
dclutch-source-contract = { path = "../../crates/dclutch-source-contract" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
bincode = "1.3.3"

[lints]
workspace = true
