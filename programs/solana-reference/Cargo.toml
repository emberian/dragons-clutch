[package]
name = "clutch-solana-reference"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline no_std reference transition adapter for Dragon's Clutch"

[lib]
path = "src/lib.rs"

[dependencies]
clutch-accumulator = { path = "../../crates/clutch-accumulator" }
clutch-bspline = { path = "../../crates/clutch-bspline" }
clutch-kernel = { path = "../../crates/clutch-kernel" }
clutch-solana-layout = { path = "../solana-layout", default-features = false }

[features]
default = ["profile-full"]
profile-full = ["clutch-solana-layout/profile-full"]
profile-direct-v3-source-v2-point = [
    "clutch-solana-layout/profile-direct-v3-source-v2-point",
]
profile-general-source-v2-point = [
    "clutch-solana-layout/profile-general-source-v2-point",
]
profile-successor-chain-attached-dev = [
    "clutch-solana-layout/profile-successor-chain-attached-dev",
]
