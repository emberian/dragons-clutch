[package]
name = "clutch-solana-layout"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Offline fixed-layout and deterministic intent codec for the transparent V1 adapter"

[lib]
path = "src/lib.rs"

[features]
default = ["profile-full"]
# Exactly one deployable capability profile must be selected.  The profiles
# gate the hostile intent decoder as well as the account-codec modules that are
# not part of the selected product.  `profile-full` preserves the historical
# host/default surface.
profile-full = []
profile-direct-v3-source-v2-point = []
profile-general-source-v2-point = ["clutch-batch/profile-general-source-v2-point"]
# Host-only hostile-byte decoder for withdrawn General V3 fixtures. The crate
# rejects this feature, and all `cfg(test)` forensic decoders, on Solana.
non-production-legacy-general-v3-hostile-decode = []
# Makes the successor Product/Series-only artifact kinds decodable for the
# explicit local-bank vertical slice. RegistryRelease and CapabilityProfile
# remain central immutable artifact kinds in every build.
non-production-product-series-lab = []

[dependencies]
# The relation whose order types the page→order projection maps onto.  Both
# crates live inside the no_alloc boundary: no_std, no heap, fixed arrays only.
clutch-batch = { path = "../../crates/clutch-batch" }
clutch-batch-policy-identity = { path = "../../research/batch-policy-identity" }
clutch-collateral-adapter-v2 = { path = "../../crates/clutch-collateral-adapter-v2" }
clutch-product-series = { path = "../../crates/clutch-product-series" }
clutch-source-plane-v3-adapter = { path = "../../crates/clutch-source-plane-v3-adapter" }
clutch-source-plane-v3-runtime = { path = "../../crates/clutch-source-plane-v3-runtime" }

[target.'cfg(target_os = "solana")'.dependencies]
# Safe wrapper around Solana's native SHA-256 syscall.  Order-page verification
# and post-mutation sealing each commit roughly 5 KiB; the portable first-party
# implementation is retained everywhere off-chain, while SBF needs the native
# primitive to fit beneath the transaction compute ceiling.
solana-sha256-hasher = { version = "=3.1.0", default-features = false }

[dev-dependencies]
# The host implementation is test-only and lets the native preimage assembly be
# checked byte-for-byte against the portable first-party SHA-256 path.
solana-sha256-hasher = { version = "=3.1.0", default-features = false, features = ["sha2"] }

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ['cfg(target_os, values("solana"))']
