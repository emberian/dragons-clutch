[package]
name = "dclutch-series-shadow-bundle-generator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Host compiler for one exact recurring-Series Shadow-AOT bundle"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-account-profile-contract = { path = "../../../crates/dclutch-account-profile-contract" }
dclutch-capability-program-contract = { path = "../../../crates/dclutch-capability-program-contract" }
dclutch-core-contract = { path = "../../../crates/dclutch-core-contract" }
dclutch-effect-kernel = { path = "../../../crates/dclutch-effect-kernel" }
dclutch-execution-strategy-contract = { path = "../../../crates/dclutch-execution-strategy-contract" }
dclutch-request-profile-contract = { path = "../../../crates/dclutch-request-profile-contract" }
dclutch-trading-sbf = { path = "../../dclutch-trading-sbf", default-features = false, features = ["series-family", "no-entrypoint"] }
dclutch-transition-vm = { path = "../../../crates/dclutch-transition-vm" }
sha2 = "0.10"

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
