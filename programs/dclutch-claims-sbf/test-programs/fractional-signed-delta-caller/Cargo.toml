[package]
name = "dclutch-fractional-signed-delta-test-caller-sbf"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.89"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-claims-svm = { path = "../../../../crates/dclutch-claims-svm" }
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-fractional-claim-contract = { path = "../../../../crates/dclutch-fractional-claim-contract" }
dclutch-fractional-claims-kernel = { path = "../../../../crates/dclutch-fractional-claims-kernel" }
dclutch-release-set-contract = { path = "../../../../crates/dclutch-release-set-contract" }
solana-program = { version = "=3.0.0", default-features = false }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
