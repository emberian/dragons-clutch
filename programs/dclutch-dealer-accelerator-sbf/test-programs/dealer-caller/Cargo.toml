[package]
name = "dclutch-dealer-accelerator-test-caller-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-capability-program-contract = { path = "../../../../crates/dclutch-capability-program-contract" }
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-refusal-registry = { path = "../../../../crates/dclutch-refusal-registry" }
dclutch-release-set-contract = { path = "../../../../crates/dclutch-release-set-contract" }
solana-program = { version = "=3.0.0", default-features = false }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
