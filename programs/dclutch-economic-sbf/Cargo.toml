[package]
name = "dclutch-economic-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin Solana account and exact-custody adapter for the shared economic kernel"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-economic-adapter-contract = { path = "../../crates/dclutch-economic-adapter-contract" }
dclutch-economic-kernel = { path = "../../crates/dclutch-economic-kernel" }
dclutch-release-set-contract = { path = "../../crates/dclutch-release-set-contract" }
dclutch-token-svm = { path = "../../crates/dclutch-token-svm" }
solana-program = { version = "=3.0.0", default-features = false }

[lints]
workspace = true
