[package]
name = "dclutch-custody-proof-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Real SPL custody adapter for the Lean-owned Direct physical plan"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-token-svm = { path = "../../crates/dclutch-token-svm" }
solana-program = { version = "=3.0.0", default-features = false }

[lints]
workspace = true
