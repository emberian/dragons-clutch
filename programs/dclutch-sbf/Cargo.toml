[package]
name = "dclutch-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []
non-production-real-pyth-lab = ["dclutch-pyth-svm/synthetic-local-fixture"]

[dependencies]
dclutch-capability-contract = { path = "../../crates/dclutch-capability-contract" }
dclutch-collateral-contract = { path = "../../crates/dclutch-collateral-contract" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-dealer-contract = { path = "../../crates/dclutch-dealer-contract" }
dclutch-direct-contract = { path = "../../crates/dclutch-direct-contract" }
dclutch-general-contract = { path = "../../crates/dclutch-general-contract" }
dclutch-kernel = { path = "../../crates/dclutch-kernel" }
dclutch-market-contract = { path = "../../crates/dclutch-market-contract" }
dclutch-product-contract = { path = "../../crates/dclutch-product-contract" }
dclutch-pyth-contract = { path = "../../crates/dclutch-pyth-contract" }
dclutch-pyth-svm = { path = "../../crates/dclutch-pyth-svm" }
dclutch-realm-contract = { path = "../../crates/dclutch-realm-contract" }
dclutch-relay-contract = { path = "../../crates/dclutch-relay-contract" }
dclutch-record-contract = { path = "../../crates/dclutch-record-contract" }
dclutch-rent-contract = { path = "../../crates/dclutch-rent-contract" }
dclutch-series-contract = { path = "../../crates/dclutch-series-contract" }
dclutch-source-contract = { path = "../../crates/dclutch-source-contract" }
dclutch-terminal-contract = { path = "../../crates/dclutch-terminal-contract" }
dclutch-token-svm = { path = "../../crates/dclutch-token-svm" }
solana-program = { version = "=3.0.0", default-features = false }
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
spl-token-2022-interface = { version = "=3.1.1", default-features = false }

[lints]
workspace = true
