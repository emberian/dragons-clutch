[package]
name = "dclutch-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []
non-production-real-pyth-lab = ["dclutch-pyth-svm/synthetic-local-fixture"]

[dependencies]
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-kernel = { path = "../../crates/dclutch-kernel" }
dclutch-pyth-contract = { path = "../../crates/dclutch-pyth-contract" }
dclutch-pyth-svm = { path = "../../crates/dclutch-pyth-svm" }
solana-program = { version = "=3.0.0", default-features = false }

[lints]
workspace = true
