resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

# The profile cargo-dist builds released binaries with. Cargo reads profiles
# only from a workspace root, and since 2026-09-05 that is this file for every
# package in the tree -- `tools/dclutch-cli`, the crate it applies to, included.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
