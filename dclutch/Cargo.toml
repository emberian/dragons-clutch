[workspace]
members = [
    "crates/dclutch-claims",
    "crates/dclutch-core-contract",
    "crates/dclutch-custody",
    "crates/dclutch-trading",
    "crates/dclutch-direct-ticket",
    "crates/dclutch-liability-basis-v2-kernel",
    "crates/dclutch-market",
    "crates/dclutch-market-open-v1-operator",
    "crates/dclutch-market-retirement-v1-operator",
    "crates/dclutch-operator",
    "crates/dclutch-partition-quality-wasm",
    "crates/dclutch-product-compiler",
    "crates/dclutch-product",
    "crates/dclutch-product-runtime-v2-operator",
    "crates/dclutch-provider-transport-v3-operator",
    "crates/dclutch-product-payoff-v2-wasm",
    "crates/dclutch-refusal-registry",
    "crates/dclutch-rational-open-wasm",
    "crates/dclutch-registry",
    "crates/dclutch-release-tool",
    "crates/dclutch-resolution-core-v3-operator",
    "crates/dclutch-sbf-runtime",
    "crates/dclutch-sha256-adapter",
    "crates/dclutch-source",
    "crates/dclutch-source-readiness-wasm",
    "crates/dclutch-source-provider-wasm",
    "crates/dclutch-vm",
    "crates/dclutch-user-position-admission-wasm",
    "crates/dclutch-wallet-terminal-input-wasm",
    "crates/dclutch-wallet-terminal-payout-wasm",
    "crates/dclutch-versioned-message-operator",
    "programs/dclutch-rent-sbf",
    "programs/dclutch-custody-sbf",
    "programs/dclutch-core-sbf",
    "programs/dclutch-claims-sbf",
    "programs/dclutch-resolution-proof-sbf",
    "programs/dclutch-registry-sbf",
    "programs/dclutch-trading-sbf",
    "crates/dclutch-direct-aot-contract",
    "programs/dclutch-accelerator-sbf",
    "tools/gauntlet/program-test-evidence",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
