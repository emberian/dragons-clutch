[package]
name = "dclutch-web-founding-vector-generator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Emits the browser's DCLTGMF1 golden vectors from the first-party Rust encoders"

# A member of the one workspace. It is a one-shot emitter run by hand, so build
# it by name (`cargo run -p dclutch-web-founding-fixture-generator`); being a
# member is what puts it under `tools/gate locks` and the workspace check
# instead of behind a lockfile nothing resolved.
[dependencies]
dclutch-market = { path = "../../../../../crates/dclutch-market" }
dclutch-source = { path = "../../../../../crates/dclutch-source" }

[[bin]]
name = "dclutch-web-founding-vector-generator"
path = "src/main.rs"
