name = "dclutch-semantics"
version = "0.1.0"
defaultTargets = ["DClutchSemantics"]

# The library is the only target.  Every emitter (`Emit*.lean` at this root)
# is run as a script by its guard -- `lake build DClutchSemantics.<Module>`
# then `lake env lean --run Emit<Surface>.lean` -- so it needs no executable
# target here; none was ever invoked by `lake exe`.
[[lean_lib]]
name = "DClutchSemantics"
globs = ["DClutchSemantics.+"]
