[package]
name = "dclutch-source-readiness-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
dclutch-operator = { path = "../dclutch-operator", default-features = false }
wasm-bindgen = "=0.2.127"

# Two getrandom majors reach this target and each refuses wasm32 until told
# which browser backend to use. 0.4 arrives through the operator's
# `dclutch-direct-ticket -> solana-signature[verify] -> solana-ed25519 -> rand`
# edge, which the 2026-09-04 operator merge made this crate's as well; the
# admission wasm crate carries the same pair for the same reason.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
