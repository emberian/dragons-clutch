[package]
name = "dclutch-claims-conservation-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Conservative complete-set split/merge semantics joining uniform Claims deltas to one Claims-role Custody transfer"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-custody-contract = { path = "../dclutch-custody-contract" }
dclutch-source-contract = { path = "../dclutch-source-contract" }

# The legacy economic slice kernel is a TEST subject, not a dependency of the
# conservation semantics: `tests.rs` executes it to exhibit the two defects a
# bare complete-set action has today. Nothing in `lib.rs` links it.
[dev-dependencies]
dclutch-economic-slice-kernel = { path = "../dclutch-economic-slice-kernel" }

[lints]
workspace = true
