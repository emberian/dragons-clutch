[package]
name = "dclutch-product-payoff-v2-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# The codec and nothing else. It depends only on `dclutch-product`
# and `dclutch-sha256-adapter`, both `no_std` kernels with no Solana SDK, no
# signature verification and therefore no `getrandom` edge -- which is why this
# boundary needs none of the wasm32 backend plumbing the admission planner does.
[dependencies]
dclutch-product = { path = "../dclutch-product" }
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.127"

[lints]
workspace = true
