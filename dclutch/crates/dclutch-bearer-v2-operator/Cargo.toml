[package]
name = "dclutch-bearer-v2-operator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Chain-derived Rational Representation V2 specialization gate for Bearer claims"

[dependencies]
dclutch-vm = { path = "../dclutch-vm" }
dclutch-claims = { path = "../dclutch-claims" }
dclutch-market = { path = "../dclutch-market" }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-hot-bump-miner-v1 = { path = "../dclutch-hot-bump-miner-v1" }
dclutch-product = { path = "../dclutch-product" }
dclutch-rational-representation-v2-operator = { path = "../dclutch-rational-representation-v2-operator" }
dclutch-custody = { path = "../dclutch-custody" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

# Test-only, and the reason is the defect this edge exists to catch. The
# Structured route's account geometry has two authors -- this operator declares
# it and `dclutch-claims`'s composition admits it -- and every check
# confined to one side passed while the two disagreed. A dependency that
# crosses the boundary is the only instrument that can compare them.
[dev-dependencies]
dclutch-claims = { path = "../dclutch-claims" }

[lints]
workspace = true
