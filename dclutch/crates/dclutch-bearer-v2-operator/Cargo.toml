[package]
name = "dclutch-bearer-v2-operator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Chain-derived Rational Representation V2 specialization gate for Bearer claims"

[dependencies]
dclutch-account-profile-contract = { path = "../dclutch-account-profile-contract" }
dclutch-bearer-v2-contract = { path = "../dclutch-bearer-v2-contract" }
dclutch-capability-program-contract = { path = "../dclutch-capability-program-contract" }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-effect-kernel = { path = "../dclutch-effect-kernel" }
dclutch-execution-strategy-contract = { path = "../dclutch-execution-strategy-contract" }
dclutch-product-payoff-v2-codec = { path = "../dclutch-product-payoff-v2-codec" }
dclutch-rational-representation-v2-contract = { path = "../dclutch-rational-representation-v2-contract" }
dclutch-rational-representation-v2-kernel = { path = "../dclutch-rational-representation-v2-kernel" }
dclutch-rational-representation-v2-operator = { path = "../dclutch-rational-representation-v2-operator" }
dclutch-rational-representation-v2-request-contract = { path = "../dclutch-rational-representation-v2-request-contract" }
dclutch-representation-composition-v3-kernel = { path = "../dclutch-representation-composition-v3-kernel" }
dclutch-request-profile-contract = { path = "../dclutch-request-profile-contract" }
dclutch-transition-vm = { path = "../dclutch-transition-vm" }
dclutch-token-svm = { path = "../dclutch-token-svm" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
