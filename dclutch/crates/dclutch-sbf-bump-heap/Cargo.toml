[package]
name = "dclutch-sbf-bump-heap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The SBF program-heap bump allocator, shared by every dClutch executable that needs the granted heap frame"

[dependencies]
solana-program = { version = "=3.0.0", default-features = false }

# This crate is a NAMED ADAPTER, not kernel code. AGENTS.md's kernel policy puts
# the Solana SDK, account memory and the loader boundary outside the kernel in
# explicitly named adapters, and this is one: it is the whole `unsafe` surface
# of the program heap, in one auditable file, so that a second executable that
# needs the granted frame consumes it instead of writing a second copy. Every
# other lint the workspace applies to a program applies here.
[lints.rust]
missing_docs = "deny"
unsafe_code = "allow"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
