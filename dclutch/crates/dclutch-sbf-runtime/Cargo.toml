[package]
name = "dclutch-sbf-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The SBF runtime shared by every dClutch executable: the granted-heap bump allocator and the one diagnostic compute checkpoint"

[dependencies]
solana-program = { version = "=3.0.0", default-features = false }

[lints.rust]
# This crate is a NAMED ADAPTER, not kernel code. AGENTS.md's kernel policy puts
# the Solana SDK, account memory and the loader boundary outside the kernel in
# explicitly named adapters, and this is one: it is the whole `unsafe` surface
# of the program heap, in one auditable file, so that a second executable that
# needs the granted frame consumes it instead of writing a second copy. Every
# other lint the workspace applies to a program applies here.
# NOT `[lints] workspace = true`, and it never can be. The workspace table at
# the root Cargo.toml sets `unsafe_code = "forbid"`, which an inner `allow`
# cannot override -- and this crate IS the tree's `unsafe` surface, the bump
# allocator every SBF program's entrypoint installs. Inheriting would forbid the
# one thing it exists to contain. Its clippy table is the deny table verbatim
# and must be updated by hand if the root one moves.
missing_docs = "deny"
unsafe_code = "allow"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
