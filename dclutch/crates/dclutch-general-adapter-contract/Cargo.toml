[package]
name = "dclutch-general-adapter-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded verifier and streamed settlement contract for General clearing"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-account-profile-contract = { path = "../dclutch-account-profile-contract" }
dclutch-capability-program-contract = { path = "../dclutch-capability-program-contract" }
dclutch-claims-svm = { path = "../dclutch-claims-svm" }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-custody-contract = { path = "../dclutch-custody-contract" }
dclutch-effect-kernel = { path = "../dclutch-effect-kernel" }
dclutch-execution-strategy-contract = { path = "../dclutch-execution-strategy-contract" }
dclutch-general-codec = { path = "../dclutch-general-codec" }
dclutch-general-config-contract = { path = "../dclutch-general-config-contract" }
dclutch-product-runtime-v2 = { path = "../dclutch-product-runtime-v2" }
dclutch-product-runtime-v2-admission = { path = "../dclutch-product-runtime-v2-admission" }
dclutch-request-profile-contract = { path = "../dclutch-request-profile-contract" }
dclutch-release-set-contract = { path = "../dclutch-release-set-contract" }
dclutch-sha256-adapter = { path = "../dclutch-sha256-adapter" }
dclutch-transition-vm = { path = "../dclutch-transition-vm" }

# Off-chain only, exactly like the `activation_bundle_v1` module it serves: an
# activation triple is authored by release tooling and never by a program, and
# the SBF artifact must not be able to reach it even by accident.
[target.'cfg(not(target_os = "solana"))'.dependencies]
dclutch-capability-activation-codec = { path = "../dclutch-capability-activation-codec" }

[lints]
workspace = true
