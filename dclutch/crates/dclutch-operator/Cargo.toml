[package]
name = "dclutch-operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["dealer-series", "successor"]
# The Dealer and Series planners link the canonical Trading family owners.
# Browser transports enable this feature after opting both getrandom majors
# into WASM. Transient SBF runtime headers have pointer-width-specific exact
# size assertions; the fixed-address SBF heap constructor is unavailable on
# 32-bit targets. No protocol algorithm or wire changes with the target.
dealer-series = ["dep:dclutch-trading-sbf"]
# The General producer uses portable official transaction types; native file
# transport is excluded from browser builds.
successor = []
# The wallet-terminal payout fixtures a program-test builds its scenario from.
test-fixtures = []

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
dclutch-sha256-adapter = { path = "../dclutch-sha256-adapter" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
solana-signature = { version = "=3.5.2", features = ["serde"] }
solana-transaction = { version = "=3.1.0", default-features = false, features = ["serde", "bincode"] }
spl-associated-token-account-interface = { version = "=2.0.0", default-features = false }
dclutch-vm = { path = "../dclutch-vm" }
dclutch-market = { path = "../dclutch-market" }
dclutch-claims = { path = "../dclutch-claims", features = ["svm"] }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-custody = { path = "../dclutch-custody" }
dclutch-trading = { path = "../dclutch-trading" }
# `SignedDirectIntentV3` only. `default-features = false` drops the `author`
# feature and with it every signer: this crate goes on linking nothing that can
# sign, which is a claim its module documentation makes out loud.
dclutch-direct-ticket = { path = "../dclutch-direct-ticket", default-features = false }
dclutch-product = { path = "../dclutch-product", features = ["svm"] }
dclutch-market-open-v1-operator = { path = "../dclutch-market-open-v1-operator" }
dclutch-product-runtime-v2-operator = { path = "../dclutch-product-runtime-v2-operator" }
dclutch-provider-transport-v3-operator = { path = "../dclutch-provider-transport-v3-operator" }
dclutch-registry = { path = "../dclutch-registry", features = ["svm"] }
dclutch-source = { path = "../dclutch-source" }
dclutch-resolution-core-v3-operator = { path = "../dclutch-resolution-core-v3-operator" }
dclutch-release-tool = { path = "../dclutch-release-tool" }
dclutch-versioned-message-operator = { path = "../dclutch-versioned-message-operator" }
dclutch-trading-sbf = { path = "../../programs/dclutch-trading-sbf", default-features = false, features = ["dealer-family", "no-entrypoint", "series-family"], optional = true }
solana-program = { version = "=3.0.0", default-features = false }
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-compute-budget-interface = "=3.1.0"
solana-hash = "=4.6.0"
solana-message = { version = "=3.1.0", features = ["bincode"] }
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
spl-token-2022-interface = { version = "=3.1.1", default-features = false }

[dev-dependencies]
solana-sdk = "=3.0.0"
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
spl-token-interface = "=3.0.0"

[lints]
workspace = true
