[package]
name = "dclutch-source-provider-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "source-provider-parity"
path = "src/bin/source-provider-parity.rs"

[dependencies]
base64 = "0.22.1"
dclutch-provider-transport-v3-operator = { path = "../dclutch-provider-transport-v3-operator" }
dclutch-source = { path = "../dclutch-source" }
dclutch-registry = { path = "../dclutch-registry" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-hash = "=4.6.0"
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"
wasm-bindgen = "=0.2.127"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }

[lints]
workspace = true
