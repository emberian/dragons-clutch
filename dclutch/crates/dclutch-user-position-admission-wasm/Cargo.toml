[package]
name = "dclutch-user-position-admission-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `default-features = false` drops `dealer-series`, and with it the Trading
# PROGRAM. That crate pins its layouts for a 64-bit target with
# `const _: [(); N] = [(); size_of::<T>()]`, so on wasm32 every pointer-bearing
# assertion fails -- `ExecutedReceiptV3` is 72 bytes on SBF and 60 here. Those
# assertions are correct for the program's real target; the planner this crate
# carries simply does not need the program.
dclutch-operator = { path = "../dclutch-operator", default-features = false }
dclutch-claims = { path = "../dclutch-claims" }
solana-program = { version = "=3.0.0", default-features = false }
base64 = "0.22.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.127"

# Two getrandom majors reach this target and each refuses wasm32 until told
# which browser backend to use. 0.4 arrives through
# `dclutch-direct-ticket -> solana-signature[verify] -> solana-ed25519 -> rand`,
# and that `verify` feature is deliberate and unconditional -- the ticket
# reader verifies every detached signature it parses -- so the edge is told
# about the browser rather than dropped.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
