[package]
description = "The Registry authority chain: release sets, finalized records, admission semantics, the Loader V3 and Registry SBF wires, and CPI-free activation-cache authentication"
name = "dclutch-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
svm = ["dep:solana-program", "dep:solana-sdk-ids"]

[dependencies]
dclutch-core-contract = { path = "../dclutch-core-contract" }
solana-program = { version = "=3.0.0", default-features = false, optional = true }
solana-sdk-ids = { version = "=3.1.0", optional = true }

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }
dclutch-core-contract = { path = "../dclutch-core-contract" }

[lints]
workspace = true
