[package]
name = "dclutch-dealer-liquidity-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
dclutch-operator = { path = "../dclutch-operator", default-features = false, features = ["dealer-series"] }
dclutch-trading-sbf = { path = "../../programs/dclutch-trading-sbf", default-features = false, features = ["dealer-family", "no-entrypoint"] }
dclutch-trading = { path = "../dclutch-trading" }
dclutch-market = { path = "../dclutch-market" }
dclutch-claims = { path = "../dclutch-claims" }
dclutch-custody = { path = "../dclutch-custody" }
dclutch-product = { path = "../dclutch-product" }
dclutch-registry = { path = "../dclutch-registry" }
solana-sdk-ids = "=3.1.0"
dclutch-core-contract = { path = "../dclutch-core-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-program = { version = "=3.0.0", default-features = false }
wasm-bindgen = "=0.2.127"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
