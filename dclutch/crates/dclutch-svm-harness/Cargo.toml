[package]
name = "dclutch-svm-harness"
version = "0.1.0"
edition = "2024"
publish = false

# This crate is deliberately its own workspace: adding it to the protocol
# workspace is a separate integration decision.
[workspace]

[dev-dependencies]
dclutch-capability-contract = { path = "../dclutch-capability-contract" }
dclutch-claims-svm = { path = "../dclutch-claims-svm" }
dclutch-collateral-contract = { path = "../dclutch-collateral-contract" }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-custody-contract = { path = "../dclutch-custody-contract" }
dclutch-direct-contract = { path = "../dclutch-direct-contract" }
dclutch-direct-codec = { path = "../dclutch-direct-codec" }
dclutch-economic-adapter-contract = { path = "../dclutch-economic-adapter-contract" }
dclutch-economic-kernel = { path = "../dclutch-economic-kernel" }
dclutch-kernel = { path = "../dclutch-kernel" }
dclutch-market-contract = { path = "../dclutch-market-contract" }
dclutch-market-core-codec = { path = "../dclutch-market-core-codec" }
dclutch-market-open-v1-operator = { path = "../dclutch-market-open-v1-operator" }
dclutch-market-retirement-v1-operator = { path = "../dclutch-market-retirement-v1-operator" }
dclutch-resolution-core-v3-operator = { path = "../dclutch-resolution-core-v3-operator" }
dclutch-pyth-contract = { path = "../dclutch-pyth-contract" }
dclutch-pyth-svm = { path = "../dclutch-pyth-svm", features = ["synthetic-local-fixture"] }
dclutch-realm-contract = { path = "../dclutch-realm-contract" }
dclutch-record-contract = { path = "../dclutch-record-contract" }
dclutch-registry-contract = { path = "../dclutch-registry-contract" }
dclutch-registry-svm = { path = "../dclutch-registry-svm" }
dclutch-release-set-contract = { path = "../dclutch-release-set-contract" }
dclutch-resolution-codec = { path = "../dclutch-resolution-codec" }
dclutch-token-svm = { path = "../dclutch-token-svm" }
dclutch-product-contract = { path = "../dclutch-product-contract" }
dclutch-product-admission-contract = { path = "../dclutch-product-admission-contract" }
dclutch-product-payoff-svm = { path = "../dclutch-product-payoff-svm" }
dclutch-product-payoff-v2-codec = { path = "../dclutch-product-payoff-v2-codec" }
dclutch-product-payoff-v2-svm = { path = "../dclutch-product-payoff-v2-svm" }
dclutch-product-runtime-v2 = { path = "../dclutch-product-runtime-v2" }
dclutch-product-runtime-v2-admission = { path = "../dclutch-product-runtime-v2-admission" }
dclutch-provider-transport-v3-operator = { path = "../dclutch-provider-transport-v3-operator", default-features = false }
dclutch-rent-contract = { path = "../dclutch-rent-contract" }
dclutch-series-contract = { path = "../dclutch-series-contract" }
dclutch-source-contract = { path = "../dclutch-source-contract" }
dclutch-terminal-contract = { path = "../dclutch-terminal-contract" }
base64 = "0.22"
serde_json = "1"
solana-program = "=3.0.0"
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-program-test = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-rpc-client = { version = "=4.2.1", default-features = false }
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode", "bytemuck"] }
solana-commitment-config = "=3.1.1"
solana-message = "=4.4.1"
solana-account = "=4.3.2"
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = "=4.1.6"
spl-token-interface = "=3.0.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
