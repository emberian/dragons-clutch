[package]
name = "dclutch-svm-harness"
version = "0.1.0"
edition = "2024"
publish = false

# This crate is deliberately its own workspace: adding it to the protocol
# workspace is a separate integration decision.
[workspace]
# The test-only caller programs declare their own workspaces (5c663da's
# precedent for nested program-test harnesses); excluding them lets this
# harness take one as a path dependency, which is what lets a campaign name
# the caller's refusal instead of typing its number.
exclude = [
    "test-programs/pre-market-funding-caller",
    "test-programs/resolution-receipt-caller",
]

[dev-dependencies]
dclutch-resolution-proof-sbf = { path = "../../programs/dclutch-resolution-proof-sbf", features = ["no-entrypoint"] }
dclutch-resolution-receipt-test-caller-sbf = { path = "test-programs/resolution-receipt-caller", features = ["no-entrypoint"] }
dclutch-pre-market-funding-test-caller-sbf = { path = "test-programs/pre-market-funding-caller", features = ["no-entrypoint"] }
dclutch-capability-contract = { path = "../dclutch-capability-contract" }
dclutch-claims-svm = { path = "../dclutch-claims-svm" }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-custody-contract = { path = "../dclutch-custody-contract" }
dclutch-capability-program-contract = { path = "../dclutch-capability-program-contract" }
dclutch-direct-codec = { path = "../dclutch-direct-codec" }
dclutch-market-core-codec = { path = "../dclutch-market-core-codec" }
dclutch-market-open-v1-operator = { path = "../dclutch-market-open-v1-operator" }
dclutch-market-retirement-v1-operator = { path = "../dclutch-market-retirement-v1-operator" }
dclutch-resolution-core-v3-operator = { path = "../dclutch-resolution-core-v3-operator" }
dclutch-pyth-svm = { path = "../dclutch-pyth-svm", features = ["synthetic-local-fixture"] }
dclutch-realm-contract = { path = "../dclutch-realm-contract" }
dclutch-record-contract = { path = "../dclutch-record-contract" }
dclutch-registry-contract = { path = "../dclutch-registry-contract" }
dclutch-registry-svm = { path = "../dclutch-registry-svm" }
dclutch-relay-contract = { path = "../dclutch-relay-contract" }
dclutch-release-set-contract = { path = "../dclutch-release-set-contract" }
dclutch-resolution-codec = { path = "../dclutch-resolution-codec" }
dclutch-token-svm = { path = "../dclutch-token-svm" }
dclutch-product-runtime-v2 = { path = "../dclutch-product-runtime-v2" }
dclutch-product-runtime-v2-operator = { path = "../dclutch-product-runtime-v2-operator" }
dclutch-product-payoff-v2-codec = { path = "../dclutch-product-payoff-v2-codec" }
dclutch-program-test-evidence = { path = "../../tools/gauntlet/program-test-evidence" }
dclutch-product-runtime-v2-admission = { path = "../dclutch-product-runtime-v2-admission" }
dclutch-provider-transport-v3-operator = { path = "../dclutch-provider-transport-v3-operator", default-features = false }
dclutch-rent-contract = { path = "../dclutch-rent-contract" }
dclutch-source-contract = { path = "../dclutch-source-contract" }
base64 = "0.22"
serde_json = "1"
solana-program = "=3.0.0"
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
# DO NOT BUMP solana-program-test to 4.3.0-beta.2 without fixing what it panics
# on. Every other pin in this block follows from this one -- solana-message
# =4.4.1 caps solana-hash below 4.6.0, which is why this workspace also holds
# solana-address-lookup-table-interface =3.1.0 and solana-account =4.3.2 while
# the rest of the tree is on =3.2.0 / =4.6.0 -- and the whole cluster looks like
# drift until you try it.
#
# Measured 2026-09-02: aligning this workspace to the set the dealer program-test
# already resolves (solana-program-test =4.3.0-beta.2, solana-message =4.5.0,
# solana-address-lookup-table-interface =3.2.0, solana-account =4.6.0,
# solana-transaction =4.2.0) RESOLVES and BUILDS, and then two
# resolution_core_v3_lifecycle tests die inside the runtime, not the campaign:
# `solana-program-runtime-4.3.0-beta.2/src/loaded_programs.rs:455` panics with
# "Unexpected replacement of an entry", taking banks_server and the SVM
# transaction processor with it. The control was run -- pristine HEAD test files,
# these pins alone changed, same two panics -- so it is the runtime and not the
# campaign that cannot take the bump.
#
# The cost of staying here is one thing, named: this workspace cannot link
# `dclutch-versioned-message-operator`, so the four converted packet campaigns
# state the packet maximum themselves and reach the canonical lookup-address
# derivation by mirroring it rather than by calling it.
solana-program-test = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-rpc-client = { version = "=4.2.1", default-features = false }
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode", "bytemuck"] }
solana-commitment-config = "=3.1.1"
solana-message = "=4.4.1"
solana-account = "=4.3.2"
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = "=4.1.6"
spl-token-interface = "=3.0.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
