[package]
name = "dclutch-trading"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The Trading families' layouts and laws: compiled Direct data, Dealer liquidity and scenarios, General clearing, Series, and the Shadow accelerator boundary"

[features]
svm = ["dep:solana-program", "dep:solana-sdk-ids"]

[dependencies]
dclutch-vm = { path = "../dclutch-vm" }
dclutch-market = { path = "../dclutch-market", features = ["alloc"] }
dclutch-claims = { path = "../dclutch-claims" }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-custody = { path = "../dclutch-custody" }
dclutch-product = { path = "../dclutch-product" }
dclutch-registry = { path = "../dclutch-registry" }
dclutch-sha256-adapter = { path = "../dclutch-sha256-adapter" }
solana-program = { version = "=3.0.0", default-features = false, optional = true }
solana-sdk-ids = { version = "=3.1.0", optional = true }

[dev-dependencies]
# Test-only, and deliberately the OTHER author: the byte-identity gate in
# `general::activation_bundle_v1` rebuilds the sealed activation triple out of
# the family-neutral template, so the template is proven to be THIS reviewed
# artifact rather than a fourth opinion of it.
dclutch-market = { path = "../dclutch-market" }
# Test-only, and deliberately the OTHER implementation: the unit tests
# recompute digests and preimages against a library no ELF links, so an
# agreement is two implementations agreeing rather than one talking to itself.
sha2 = { version = "=0.10.9", default-features = false }

# The Dealer modules were held to `clippy::all` alone until they joined this
# crate; the workspace table adds the restriction lints, and their 75 measured
# sites are the DEALER lane's row in tools/ci/clippy-debt.tsv.
[lints]
workspace = true
