[package]
name = "dclutch-rational-lifecycle-hot-v3"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "CapabilityV4-selected Hot artifacts and unsigned operator for Rational lifecycle"

[dependencies]
dclutch-vm = { path = "../dclutch-vm" }
dclutch-market = { path = "../dclutch-market" }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-hot-bump-miner-v1 = { path = "../dclutch-hot-bump-miner-v1" }
dclutch-product = { path = "../dclutch-product" }
dclutch-claims = { path = "../dclutch-claims" }
dclutch-custody = { path = "../dclutch-custody" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
# The lifecycle bump-hint positive control stages a decodable Core Market state
# so `lifecycle_hot_bump_hints_v3` has something to mine; without it every slot
# degrades to zero and a corpus reading the wrong coordinate would look
# identical to one reading the right one.
dclutch-market = { path = "../dclutch-market" }
dclutch-registry = { path = "../dclutch-registry" }

[lints]
workspace = true
