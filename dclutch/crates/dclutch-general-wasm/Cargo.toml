[package]
name = "dclutch-general-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "=0.22.1"
dclutch-operator = { path = "../dclutch-operator", default-features = false, features = ["successor"] }
dclutch-versioned-message-operator = { path = "../dclutch-versioned-message-operator" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-hash = "=4.6.0"
solana-program = { version = "=3.0.0", default-features = false }
wasm-bindgen = "=0.2.127"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true

[dev-dependencies]
dclutch-market = { path = "../dclutch-market" }
dclutch-trading = { path = "../dclutch-trading" }
