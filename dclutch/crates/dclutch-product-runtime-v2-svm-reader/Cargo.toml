[package]
name = "dclutch-product-runtime-v2-svm-reader"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-product-runtime-v2 = { path = "../dclutch-product-runtime-v2" }
dclutch-product-runtime-v2-admission = { path = "../dclutch-product-runtime-v2-admission" }
dclutch-record-contract = { path = "../dclutch-record-contract" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
