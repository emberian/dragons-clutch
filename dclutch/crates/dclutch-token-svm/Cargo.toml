[package]
name = "dclutch-token-svm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dev-dependencies]
sha2 = "=0.10.9"
solana-address = "=2.7.0"
solana-nullable = "=1.3.0"
solana-program-option = "=3.1.0"
spl-token-2022-interface = { version = "=3.1.1", default-features = false }
spl-token-metadata-interface = "=1.0.1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
