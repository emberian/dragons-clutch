[package]
name = "dclutch-representation-composition-v3-operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Chain-derived unsigned operator for Product-to-representation composition"
publish = false

[dependencies]
dclutch-market = { path = "../dclutch-market" }
dclutch-product = { path = "../dclutch-product" }
dclutch-claims = { path = "../dclutch-claims" }
dclutch-rational-lifecycle-hot-v3 = { path = "../dclutch-rational-lifecycle-hot-v3" }
dclutch-registry = { path = "../dclutch-registry" }
dclutch-versioned-message-operator = { path = "../dclutch-versioned-message-operator" }
solana-compute-budget-interface = "=3.1.0"
solana-hash = "=4.6.0"
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
dclutch-vm = { path = "../dclutch-vm" }
dclutch-market = { path = "../dclutch-market" }
dclutch-product-runtime-v2-operator = { path = "../dclutch-product-runtime-v2-operator" }
dclutch-claims = { path = "../dclutch-claims" }
dclutch-custody = { path = "../dclutch-custody" }
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode"] }
solana-message = { version = "=3.1.0", features = ["bincode"] }

[lints]
workspace = true
