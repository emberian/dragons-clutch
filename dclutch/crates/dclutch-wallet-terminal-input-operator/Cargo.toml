[package]
name = "dclutch-wallet-terminal-input-operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[features]
# The fixture the extracted-from binary's own tests build on, shared under a
# feature rather than copied. Two copies of a fixture drift, which is the thing
# an extraction exists to prevent.
test-fixtures = ["dclutch-wallet-terminal-payout-operator/test-fixtures"]

[dependencies]
dclutch-claims = { path = "../dclutch-claims" }
dclutch-market = { path = "../dclutch-market" }
# PHASE ZERO's owners. Every one of these is already inside stage two's wasm
# closure, so deriving the address book adds no crate to the browser's boundary
# -- it only stops a document being the place four digests come from.
dclutch-product = { path = "../dclutch-product" }
dclutch-representation-composition-v3-operator = { path = "../dclutch-representation-composition-v3-operator" }
# `default-features = false` drops `dealer-series`, and with it the Trading
# PROGRAM, whose 64-bit `size_of` layout assertions cannot hold on a 32-bit
# target. Those assertions are right; this derivation simply does not need the
# program. Same reason stage two takes it this way.
dclutch-operator = { path = "../dclutch-operator", default-features = false }
# Stage two. This crate is stage ONE over its wire types, its snapshot, and its
# refusal vocabulary -- one derivation in two stages, never two derivations.
dclutch-wallet-terminal-payout-operator = { path = "../dclutch-wallet-terminal-payout-operator" }
sha2 = "0.10"
# The associated-token-account program enters this crate as an ADDRESSING
# authority and nothing else: one derivation, `get_associated_token_address_
# with_program_id`, for the default destination of a payout. The protocol is
# unchanged -- the payout still accepts any token account the owner controls,
# and a caller that names one overrides this.
spl-associated-token-account-interface = { version = "=2.0.0", default-features = false }
solana-program = { version = "=3.0.0", default-features = false }

# Two getrandom majors reach wasm32 through the payout operator's own
# dependency edge and each refuses the target until told which browser backend
# to use. Declared here too so this crate builds for wasm32 on its own.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.17", features = ["js"] }
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
dclutch-wallet-terminal-payout-operator = { path = "../dclutch-wallet-terminal-payout-operator", features = ["test-fixtures"] }
solana-sdk-ids = "=3.1.0"

[lints]
workspace = true
