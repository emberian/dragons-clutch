[package]
description = "Product truth: runtime-width result domains and portfolios, the provider-neutral contract, admission receipts, the exact payoff codec, the slice kernel, and the SVM graph reader"
name = "dclutch-product"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
svm = ["dep:solana-program", "dep:solana-sdk-ids"]

[dependencies]
dclutch-sha256-adapter = { path = "../dclutch-sha256-adapter" }
dclutch-market = { path = "../dclutch-market" }
dclutch-registry = { path = "../dclutch-registry" }
solana-program = { version = "=3.0.0", default-features = false, optional = true }
solana-sdk-ids = { version = "=3.1.0", optional = true }

[dev-dependencies]
# Differential reference only, and a dev-dependency so it stays one: the kernel
# is an independent handwritten implementation of the same mathematics, which
# `O-005` explicitly permits alongside one live writer. It is linked into the
# test binary and into no ELF.
dclutch-liability-basis-v2-kernel = { path = "../dclutch-liability-basis-v2-kernel" }
dclutch-claims = { path = "../dclutch-claims", features = ["svm"] }

[lints]
workspace = true
