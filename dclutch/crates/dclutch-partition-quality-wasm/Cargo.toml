[package]
name = "dclutch-partition-quality-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# The compiler and nothing else. Its three path dependencies are `no_std`
# kernels and its only registry dependency is `sha2`, so there is no Solana
# SDK, no signature verification, and none of the wasm32 `getrandom` plumbing
# the admission planner needed.
[dependencies]
dclutch-product-compiler = { path = "../dclutch-product-compiler" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "=0.2.127"

[lints]
workspace = true
