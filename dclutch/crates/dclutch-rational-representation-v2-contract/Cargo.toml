[package]
name = "dclutch-rational-representation-v2-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Exact physical Claims/Token/Custody composition contract for rational representations"

[dependencies]
dclutch-claims-svm = { path = "../dclutch-claims-svm" }
dclutch-custody-contract = { path = "../dclutch-custody-contract" }
dclutch-rational-representation-v2-kernel = { path = "../dclutch-rational-representation-v2-kernel" }
dclutch-token-svm = { path = "../dclutch-token-svm" }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
