[package]
name = "dclutch-provider-transport-v3-operator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["transaction-planning"]
transaction-planning = ["dep:dclutch-versioned-message-operator", "dep:solana-hash"]

[dependencies]
dclutch-market = { path = "../dclutch-market" }
dclutch-product = { path = "../dclutch-product" }
dclutch-source = { path = "../dclutch-source" }
dclutch-registry = { path = "../dclutch-registry" }
dclutch-resolution-core-v3-operator = { path = "../dclutch-resolution-core-v3-operator" }
dclutch-versioned-message-operator = { path = "../dclutch-versioned-message-operator", optional = true }
solana-hash = { version = "=4.6.0", optional = true }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

[dev-dependencies]
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }

[lints]
workspace = true
