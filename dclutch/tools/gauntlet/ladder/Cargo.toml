[package]
name = "dclutch-ladder-campaign"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false

# Like the journey and the relayed vertical it stands beside, this
# localhost-only host utility resolves independently from the protocol
# workspace.
[workspace]

# NOTHING HERE IS A COPY. The tier-1 producer's modules are compiled into this
# binary VERBATIM by `#[path]`, and so is the relayed vertical's
# checked-mutable substrate bring-up -- the one runner in this tree that owns a
# validator across MORE THAN ONE command, which is the whole reason this tier
# can exist and tier 1 cannot host it. A change to the founding, to the crank
# driver, or to the substrate reaches this campaign by recompilation, and a
# change that breaks this campaign breaks this build. That is the intended
# tripwire; extend the module set, never fork a file.
[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
dclutch-market = { path = "../../../crates/dclutch-market" }
dclutch-vm = { path = "../../../crates/dclutch-vm" }
dclutch-claims = { path = "../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../../crates/dclutch-custody" }
dclutch-trading = { path = "../../../crates/dclutch-trading" }
dclutch-market-retirement-v1-operator = { path = "../../../crates/dclutch-market-retirement-v1-operator" }
dclutch-operator = { path = "../../../crates/dclutch-operator" }
dclutch-product = { path = "../../../crates/dclutch-product" }
dclutch-product-runtime-v2-operator = { path = "../../../crates/dclutch-product-runtime-v2-operator" }
dclutch-provider-transport-v3-operator = { path = "../../../crates/dclutch-provider-transport-v3-operator" }
dclutch-source = { path = "../../../crates/dclutch-source", features = ["synthetic-local-fixture"] }
dclutch-registry = { path = "../../../crates/dclutch-registry", features = ["svm"] }
dclutch-release-tool = { path = "../../../crates/dclutch-release-tool" }
dclutch-resolution-core-v3-operator = { path = "../../../crates/dclutch-resolution-core-v3-operator" }
dclutch-versioned-message-operator = { path = "../../../crates/dclutch-versioned-message-operator" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-compute-budget-interface = "=3.1.0"
solana-hash = "=4.6.0"
solana-loader-v3-interface = { version = "=6.1.0", features = ["bincode"] }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

[lints.rust]
unsafe_code = "forbid"
