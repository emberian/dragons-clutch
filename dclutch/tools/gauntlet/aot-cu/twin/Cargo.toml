[package]
name = "dclutch-direct-relation-twin"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
description = "Measurement-only twin ELF: one stateless frame, two evaluators for the same Direct V2 relation"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
# Exactly one evaluator feature must be selected at build time. The frame code
# is shared verbatim; only the evaluator call differs, so the CU difference
# between the two ELFs is the evaluator and nothing else.
default = []
aot = []
interpreted = []
null = []
no-entrypoint = []

[dependencies]
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-direct-aot-contract = { path = "../../../../crates/dclutch-direct-aot-contract" }
dclutch-execution-strategy-contract = { path = "../../../../crates/dclutch-execution-strategy-contract" }
dclutch-transition-vm = { path = "../../../../crates/dclutch-transition-vm" }
solana-program = { version = "=3.0.0", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
