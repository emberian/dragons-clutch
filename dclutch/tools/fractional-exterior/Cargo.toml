[package]
name = "dclutch-fractional-exterior"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false

# Localhost-only host utility. It was the last member on the Solana 2.1
# lineage, and its `solana-sdk = "=2.1.0"` alone held ~90 packages of an
# obsolete major in the single lock; it is on the 3.x line the rest of the tree
# runs as of 2026-09-05. The four crates below `solana-sdk` are the modules
# the 2.x SDK facade used to re-export and 3.0 does not: every version here is
# the one `dclutch-operator` already pins, so this member adds no package
# version to the lock.
[dependencies]
dclutch-operator = { path = "../../crates/dclutch-operator" }
dclutch-market = { path = "../../crates/dclutch-market" }
dclutch-claims = { path = "../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../crates/dclutch-custody" }
dclutch-product = { path = "../../crates/dclutch-product" }
dclutch-product-runtime-v2-operator = { path = "../../crates/dclutch-product-runtime-v2-operator" }
dclutch-registry = { path = "../../crates/dclutch-registry" }
dclutch-source = { path = "../../crates/dclutch-source" }
base64 = "0.22"
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-program = "=3.0.0"
solana-client = "=3.1.12"
solana-sdk = "=3.0.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-commitment-config = "=3.1.1"
solana-compute-budget-interface = "=3.1.0"
solana-message = "=3.1.0"

[lints.rust]
unsafe_code = "forbid"
