[package]
name = "dclutch-fractional-exterior"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false

# Localhost-only host utility, and the one member still on the Solana 2.1
# lineage: `solana-sdk = "=2.1.0"` below drags ~90 packages of an obsolete
# major into the single lock. Bumping it to the 3.x the rest of the tree runs
# is owed work, not a conflict.
[dependencies]
dclutch-operator = { path = "../../crates/dclutch-operator" }
dclutch-market = { path = "../../crates/dclutch-market" }
dclutch-claims = { path = "../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../crates/dclutch-custody" }
dclutch-product = { path = "../../crates/dclutch-product" }
dclutch-product-runtime-v2-operator = { path = "../../crates/dclutch-product-runtime-v2-operator" }
dclutch-registry = { path = "../../crates/dclutch-registry" }
dclutch-source = { path = "../../crates/dclutch-source" }
base64 = "0.22"
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-program = "=3.0.0"
solana-client = "=2.1.0"
solana-sdk = "=2.1.0"

[lints.rust]
unsafe_code = "forbid"
