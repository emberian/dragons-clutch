[package]
name = "dclutch-relayer"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false
description = "RelayedMainnetStateV1 observation daemon: signs observations of a foreign cluster's account bytes, never interpretations."

# A member of the one workspace.  This service needs `std`, tokio, an HTTP
# stack and Solana message construction; that tree resolves beside the `no_std`
# kernel and contract crates without a conflict, which is what the 2026-09-05
# fold measured rather than assumed.
[lib]
name = "dclutch_relayer"
path = "src/lib.rs"

[[bin]]
name = "dclutch-relayer"
path = "src/main.rs"

[dependencies]
# The wire codec.  Every encoded byte this daemon signs comes from here; the
# daemon reimplements no encoding.
dclutch-source = { path = "../../crates/dclutch-source" }
dclutch-market = { path = "../../crates/dclutch-market" }
dclutch-registry = { path = "../../crates/dclutch-registry" }

base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"

# Solana message construction for the (execution-gated) submit path.  These are
# transaction primitives only: no venue IDL, SDK, or layout crate.  See
# DEPENDENCY_CLOSURE.md.
solana-address = { version = "2", features = ["curve25519"] }
solana-hash = "4"
solana-instruction = { version = "3", default-features = false, features = ["std"] }
solana-message = { version = "=4.5.0", features = ["serde", "wincode"] }
solana-rent = { version = "=3.1.0", features = ["serde"] }
solana-signature = "3"
solana-transaction = { version = "=4.2.0", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
