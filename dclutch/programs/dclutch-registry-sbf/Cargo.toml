[package]
name = "dclutch-registry-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin activation and reauthentication adapter for dClutch execution releases"

[lib]
# `lib` alongside `cdylib` so this program's own refusal taxonomy is importable
# by the campaigns that assert on it. Without an rlib a test can only match the
# code as a number it typed out by hand, which is the drift decision 0007 exists
# to end. Four sibling programs already ship both crate types.
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-market = { path = "../../crates/dclutch-market" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-registry = { path = "../../crates/dclutch-registry", features = ["svm"] }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

[dev-dependencies]
# The host builder under test. `DeclareSuccessor` is the one route whose frame
# nothing outside the operator crate can construct, so the campaign drives the
# real ELF with the real builder rather than a second hand-assembled frame that
# could agree with the program while the shipped builder does not.
dclutch-operator = { path = "../../crates/dclutch-operator" }
solana-account = "=4.6.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-transaction = "=4.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
