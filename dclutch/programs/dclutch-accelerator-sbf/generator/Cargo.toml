[package]
name = "dclutch-series-shadow-bundle-generator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Host compiler for one exact recurring-Series Shadow-AOT bundle"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-vm = { path = "../../../crates/dclutch-vm" }
dclutch-market = { path = "../../../crates/dclutch-market" }
dclutch-claims = { path = "../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../../crates/dclutch-custody" }
dclutch-product = { path = "../../../crates/dclutch-product" }
dclutch-registry = { path = "../../../crates/dclutch-registry" }
dclutch-trading = { path = "../../../crates/dclutch-trading" }
dclutch-trading-sbf = { path = "../../dclutch-trading-sbf", default-features = false, features = ["series-family", "no-entrypoint"] }
sha2 = "0.10"

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
