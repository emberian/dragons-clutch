[package]
name = "dclutch-accelerator-dealer-program-test"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.89"

[dependencies]
dclutch-vm = { path = "../../../crates/dclutch-vm" }
dclutch-market = { path = "../../../crates/dclutch-market" }
dclutch-chain-bundle-builder = { path = "../../dclutch-trading-sbf/program-test/bundle-builder" }
dclutch-claims = { path = "../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../../crates/dclutch-custody" }
dclutch-trading = { path = "../../../crates/dclutch-trading" }
dclutch-dealer-accelerator-test-caller-sbf = { path = "../test-programs/dealer-caller", features = ["no-entrypoint"] }
dclutch-fractional-atomic-program-test = { path = "../../dclutch-claims-sbf/program-test/fractional-atomic" }
dclutch-operator = { path = "../../../crates/dclutch-operator" }
dclutch-versioned-message-operator = { path = "../../../crates/dclutch-versioned-message-operator" }
dclutch-program-test-evidence = { path = "../../../tools/gauntlet/program-test-evidence" }
dclutch-product = { path = "../../../crates/dclutch-product" }
dclutch-refusal-registry = { path = "../../../crates/dclutch-refusal-registry" }
dclutch-registry = { path = "../../../crates/dclutch-registry", features = ["svm"] }
dclutch-resolution-core-v3-operator = { path = "../../../crates/dclutch-resolution-core-v3-operator" }
dclutch-trading-sbf = { path = "../../dclutch-trading-sbf", default-features = false, features = ["dealer-family", "series-family", "no-entrypoint"] }
solana-account = "=4.6.0"
solana-clock = "=3.2.0"
solana-compute-budget-interface = "=3.1.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-message = "=4.5.0"
solana-message-v3 = { package = "solana-message", version = "=3.1.0", features = ["bincode"] }
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-program = "=3.0.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-transaction = "=4.2.0"
spl-token-interface = "=3.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
