[package]
name = "dclutch-accelerator-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "The one readonly stateless accelerator: General clearing, the Dealer families and the Series shadow"
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = ["custom-heap"]
no-entrypoint = []
custom-heap = ["dep:dclutch-sbf-bump-heap"]
custom-panic = []
# Diagnostic-only compute checkpoints in every arm. OFF in every shipped
# build. The Dealer arm's trail continues Trading's `hot-cu-profile` trail,
# because the two are one measurement.
cu-profile = ["dclutch-trading-sbf/hot-cu-profile"]
# Diagnostic-only heap readings from the General arm. OFF in every shipped
# build.
heap-profile = []

[dependencies]
dclutch-account-profile-contract = { path = "../../crates/dclutch-account-profile-contract" }
dclutch-capability-contract = { path = "../../crates/dclutch-capability-contract" }
dclutch-capability-program-contract = { path = "../../crates/dclutch-capability-program-contract" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-effect-kernel = { path = "../../crates/dclutch-effect-kernel" }
dclutch-execution-strategy-contract = { path = "../../crates/dclutch-execution-strategy-contract", features = ["alloc"] }
dclutch-general-adapter-contract = { path = "../../crates/dclutch-general-adapter-contract" }
dclutch-general-codec = { path = "../../crates/dclutch-general-codec" }
dclutch-general-config-contract = { path = "../../crates/dclutch-general-config-contract" }
dclutch-market-core-codec = { path = "../../crates/dclutch-market-core-codec" }
dclutch-product-runtime-v2-svm-reader = { path = "../../crates/dclutch-product-runtime-v2-svm-reader" }
dclutch-record-contract = { path = "../../crates/dclutch-record-contract" }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
dclutch-request-profile-contract = { path = "../../crates/dclutch-request-profile-contract" }
dclutch-sbf-bump-heap = { path = "../../crates/dclutch-sbf-bump-heap", optional = true }
dclutch-series-v3-kernel = { path = "../../crates/dclutch-series-v3-kernel" }
dclutch-sha256-adapter = { path = "../../crates/dclutch-sha256-adapter" }
dclutch-shadow-accelerator-auth-v4 = { path = "../../crates/dclutch-shadow-accelerator-auth-v4" }
dclutch-trading-sbf = { path = "../dclutch-trading-sbf", default-features = false, features = ["dealer-family", "series-family", "no-entrypoint"] }
dclutch-transition-vm = { path = "../../crates/dclutch-transition-vm" }
solana-compute-budget-interface = "=3.1.0"
solana-instructions-sysvar = "=3.0.1"
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[lints]
workspace = true
