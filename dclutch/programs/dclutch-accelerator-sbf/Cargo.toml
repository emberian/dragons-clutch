[package]
name = "dclutch-accelerator-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "The one readonly stateless accelerator: General clearing, the Dealer families and the Series shadow"
build = "build.rs"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = ["custom-heap"]
no-entrypoint = []
custom-heap = ["dep:dclutch-sbf-runtime"]
custom-panic = []
# Diagnostic-only compute checkpoints in every arm. OFF in every shipped
# build. The Dealer arm's trail continues Trading's `hot-cu-profile` trail,
# because the two are one measurement.
cu-profile = ["dclutch-trading-sbf/hot-cu-profile"]
# Diagnostic-only heap readings from the General arm. OFF in every shipped
# build.
heap-profile = []

[dependencies]
dclutch-vm = { path = "../../crates/dclutch-vm" }
dclutch-market = { path = "../../crates/dclutch-market", features = ["alloc"] }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-trading = { path = "../../crates/dclutch-trading", features = ["svm"] }
dclutch-product = { path = "../../crates/dclutch-product", features = ["svm"] }
dclutch-registry = { path = "../../crates/dclutch-registry" }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
dclutch-sbf-runtime = { path = "../../crates/dclutch-sbf-runtime", optional = true }
dclutch-sha256-adapter = { path = "../../crates/dclutch-sha256-adapter" }
dclutch-trading-sbf = { path = "../dclutch-trading-sbf", default-features = false, features = ["dealer-family", "series-family", "no-entrypoint"] }
solana-compute-budget-interface = "=3.1.0"
solana-instructions-sysvar = "=3.0.1"
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[lints]
workspace = true
