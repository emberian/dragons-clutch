[package]
name = "dclutch-direct-aot-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Stateless SBF accelerator for the Lean-owned Direct V2 descriptor"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-direct-aot-contract = { path = "../../crates/dclutch-direct-aot-contract" }
dclutch-execution-strategy-contract = { path = "../../crates/dclutch-execution-strategy-contract" }
solana-program = { version = "=3.0.0", default-features = false }

dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
[dev-dependencies]
solana-hash = "=4.6.0"
solana-message = "=4.5.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-transaction = "=4.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
