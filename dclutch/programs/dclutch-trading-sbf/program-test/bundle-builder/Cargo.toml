[package]
name = "dclutch-chain-bundle-builder"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
dclutch-operator = { path = "../../../../crates/dclutch-operator" }
dclutch-vm = { path = "../../../../crates/dclutch-vm" }
dclutch-market = { path = "../../../../crates/dclutch-market", features = ["alloc"] }
dclutch-claims = { path = "../../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../../../crates/dclutch-custody" }
dclutch-trading = { path = "../../../../crates/dclutch-trading" }
dclutch-registry = { path = "../../../../crates/dclutch-registry" }
sha2 = { version = "=0.10.9", default-features = false }
solana-account = "=4.6.0"
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
dclutch-trading = { path = "../../../../crates/dclutch-trading" }
dclutch-direct-hot-program-test-support = { path = "../direct-hot" }
dclutch-custody = { path = "../../../../crates/dclutch-custody" }

# NOT `[lints] workspace = true`, and the reason is structural rather than a
# finding about this crate. It belongs to TWO workspaces -- the root one, which
# claims it as a path dependency of a member, and
# `programs/dclutch-trading-sbf/program-test`, which lists it -- and only the
# root defines `[workspace.lints]`. Inheriting therefore breaks
# `cargo metadata --locked` for the program-test workspace ("failed to load
# manifest for dependency"), which is the `locks` CI tier. Measured 2026-09-02.
# The fix is a `[workspace.lints]` table in the program-test workspace root, and
# whoever adds it must first measure `dclutch-direct-hot-program-test-support`
# under the deny table -- currently impossible, because it sits behind
# dealer-codec and trading-sbf in tools/ci/clippy-debt.tsv.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
