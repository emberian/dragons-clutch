[package]
name = "dclutch-trading-program-test"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
[dependencies]
dclutch-vm = { path = "../../../crates/dclutch-vm" }
dclutch-market = { path = "../../../crates/dclutch-market" }
dclutch-chain-bundle-builder = { path = "bundle-builder" }
dclutch-claims = { path = "../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../../crates/dclutch-custody" }
# `direct_hot_fee_second_transaction` asserts the exact Custody refusal codes
# two hostile orderings carry, and decision 0007 forbids writing them as bare
# numbers. Custody ships an rlib beside its cdylib for exactly this, the same
# way Registry does above.
dclutch-custody-sbf = { path = "../../dclutch-custody-sbf", features = [
    "no-entrypoint",
] }
dclutch-trading = { path = "../../../crates/dclutch-trading" }
# The ONE author of a portable Direct ticket, taken with its signer so this
# workspace can author a real ticket file rather than a second implementation of
# the signing preimage. `ticket_authored_intents_execute_top_level` writes two
# tickets to disk, reads them back with the same crate the CLI reads them with,
# and hands their signatures to the Ed25519 program.
dclutch-direct-ticket = { path = "../../../crates/dclutch-direct-ticket" }
dclutch-direct-hot-program-test-support = { path = "direct-hot" }
# The PDA bump-search cost model the two margin gates and the two depth censuses
# all subtract. It lived four times in this directory -- twice in u64 and twice
# in u32 -- for a rule that belongs to the runtime rather than to any route, and
# the claims-extended budgets need the same arithmetic. One author, here,
# because `direct-hot` above already depends on this crate.
dclutch-program-test-evidence = { path = "../../../tools/gauntlet/program-test-evidence" }
# `direct_close_maker_on_chain` drives the operator's close plan builder against
# the real ELFs. A builder tested only against its own hand-written fixture
# proves that it agrees with itself; the question worth answering is whether the
# instruction it emits is one the deployed program actually accepts.
dclutch-operator = { path = "../../../crates/dclutch-operator" }
dclutch-product = { path = "../../../crates/dclutch-product" }
dclutch-registry = { path = "../../../crates/dclutch-registry" }
# Several `registry_hot_continuation` cases refuse inside the Registry program
# rather than in Trading, so their refusal codes must be derived from
# `RegistryError` itself and never written as bare numbers (AGENTS.md "Refusal
# codes", decision 0007). Registry ships an rlib beside its cdylib for exactly
# this, as its own `[lib]` comment says.
dclutch-registry-sbf = { path = "../../dclutch-registry-sbf", features = [
    "no-entrypoint",
] }
dclutch-trading-sbf = { path = "..", features = ["no-entrypoint"] }
solana-account = "=4.6.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-compute-budget-interface = "=3.1.0"
solana-message = "=4.5.0"
solana-program = { version = "=3.0.0", default-features = false }
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = "=4.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# `direct_hot_fee_second_transaction` is a PROBE, not a member of this suite.
# It substitutes the Trading ELF with `test-programs/custody-leg-caller` and
# stages its own release set, so it means something only under the runner that
# builds that set -- `run-fee-second-transaction.sh`, which is also the only
# thing that sets `DCLUTCH_CUSTODY_LEG_CALLER_ELF`. Swept into the ordinary run
# it cannot work: it would be pointed at the REAL Trading ELF, which is exactly
# the substitution the probe exists to avoid.
#
# Until this gate it was auto-discovered like the other twelve, so
# `tools/ci/run.sh programs` ran it, got `NotPresent` for that variable, and
# reported a MISSING PREREQUISITE as a failed compute-margin gate. That is the
# one sentence that tier must never say wrongly: its red is supposed to mean
# the public Direct route got more expensive, and a reader who learns that red
# is sometimes a missing env var stops believing it when it is real.
[features]
fee-second-transaction = []

[[test]]
name = "direct_hot_fee_second_transaction"
path = "tests/direct_hot_fee_second_transaction.rs"
required-features = ["fee-second-transaction"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
