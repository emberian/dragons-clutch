[package]
name = "dclutch-direct-hot-program-test-support"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
dclutch-vm = { path = "../../../../crates/dclutch-vm" }
dclutch-market = { path = "../../../../crates/dclutch-market" }
dclutch-chain-bundle-builder = { path = "../bundle-builder" }
dclutch-claims = { path = "../../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../../../crates/dclutch-custody" }
dclutch-trading = { path = "../../../../crates/dclutch-trading" }
dclutch-operator = { path = "../../../../crates/dclutch-operator" }
dclutch-program-test-evidence = { path = "../../../../tools/gauntlet/program-test-evidence" }
dclutch-product = { path = "../../../../crates/dclutch-product" }
dclutch-product-runtime-v2-operator = { path = "../../../../crates/dclutch-product-runtime-v2-operator" }
dclutch-registry = { path = "../../../../crates/dclutch-registry" }
sha2 = { version = "=0.10.9", default-features = false }
solana-account = "=4.6.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-message = "=4.5.0"
solana-program = { version = "=3.0.0", default-features = false }
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-transaction = "=4.2.0"
spl-token-interface = "=3.0.0"

# NOT `[lints] workspace = true`, and the structural reason is gone. Until
# 2026-09-05 this crate belonged to TWO workspaces -- the root one, which
# claimed it as a path dependency of a member, and
# `programs/dclutch-trading-sbf/program-test`, which listed it -- and only the
# root defined `[workspace.lints]`, so inheriting broke `cargo metadata
# --locked` for the program-test workspace. There is one workspace now and
# inheriting would resolve. What is left is an ORDERING debt, not a structural
# one: adopting the deny table means measuring
# `dclutch-direct-hot-program-test-support` under it, and that sits behind
# dealer-codec and trading-sbf in tools/gates/clippy-debt.tsv. Whoever clears
# those rows deletes this table and inherits.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
