# Replay one captured devnet transaction, byte for byte, in ProgramTest.
#
# The instrument this crate exists to provide is the ELF SUBSTITUTION. A
# release pins its ELF by DIGEST AND DEPLOYMENT SLOT, so an instrumented
# Trading refuses `Release` on any release-pinned chain and the tree's own
# `hot-cu-profile` checkpoints are unusable exactly where a coarse refusal
# needs them. On chain that is a wall; here it is not, because a hot route
# never hashes an ELF (`crates/dclutch-trading/src/shadow_accelerator_auth/
# deployment.rs:97-108` takes the activation-bound arm, and
# `slot_pinned_release_elf_digest_v1` compares the SLOT and the AUTHORITY and
# returns the release's own digest). So `--programdata-elf` rewrites the ELF
# tail of a captured ProgramData account and leaves its 45-byte Loader V3
# header alone: every on-chain pin still holds and the bytes that execute are
# the profiled ones.
[package]
name = "dclutch-devnet-frame-replay"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "dclutch-devnet-frame-replay"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
bs58 = "=0.5.1"
serde_json = "=1.0.151"
solana-account = "=4.6.0"
solana-clock = { version = "=3.2.0", features = ["serde", "sysvar"] }
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-pubkey = "=4.3.0"
solana-transaction = "=4.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
