[package]
name = "dclutch-trading-user-position-admission-program-test"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.89"

[dependencies]
dclutch-claims-affine-batch-program-test = { path = "../../../dclutch-claims-sbf/program-test/affine-batch" }
dclutch-claims = { path = "../../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-registry = { path = "../../../../crates/dclutch-registry" }
dclutch-market = { path = "../../../../crates/dclutch-market" }
solana-account = "=4.3.2"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode", "bytemuck"] }
solana-message = "=4.4.1"
solana-program = { version = "=3.0.0" }
solana-program-test = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
solana-transaction = "=4.1.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
# The census half. `record` is a no-op unless DCLUTCH_PROGRAM_TEST_EVIDENCE_DIR
# is set, so this campaign stays an ordinary `cargo test` and additionally emits
# the evidence `dclutch-route-census observe` corroborates a binding against.
dclutch-program-test-evidence = { path = "../../../../tools/gauntlet/program-test-evidence" }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
