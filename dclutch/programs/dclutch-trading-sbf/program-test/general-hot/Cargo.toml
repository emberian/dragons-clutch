[package]
name = "dclutch-general-hot-program-test"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
dclutch-market = { path = "../../../../crates/dclutch-market", features = ["alloc"] }
dclutch-vm = { path = "../../../../crates/dclutch-vm" }
dclutch-chain-bundle-builder = { path = "../bundle-builder" }
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-trading = { path = "../../../../crates/dclutch-trading" }
dclutch-direct-hot-program-test-support = { path = "../direct-hot" }
dclutch-operator = { path = "../../../../crates/dclutch-operator" }
dclutch-product = { path = "../../../../crates/dclutch-product" }
dclutch-product-runtime-v2-operator = { path = "../../../../crates/dclutch-product-runtime-v2-operator" }
dclutch-registry = { path = "../../../../crates/dclutch-registry" }
# The refusal codes this campaign's hostiles name, derived from the REGISTERED
# BAND rather than written out. Decision 0007 names this as the alternative to
# the enum where taking a dependency on the program would be wrong, and here it
# is: a direct `dclutch-trading-sbf` dependency adds the `families` feature to
# this package's feature union, which links the whole Series and Dealer adapter
# closure into a General campaign's HOST build for one `u32` -- and couples this
# suite's ability to compile to every lane editing those adapters in the shared
# checkout. A bare literal is what neither of those is.
dclutch-refusal-registry = { path = "../../../../crates/dclutch-refusal-registry" }
sha2 = { version = "=0.10.9", default-features = false }
solana-account = "=4.6.0"
solana-compute-budget-interface = "=3.1.0"
solana-program = { version = "=3.0.0", default-features = false }
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
