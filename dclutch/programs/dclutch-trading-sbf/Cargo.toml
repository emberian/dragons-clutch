[package]
name = "dclutch-trading-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Canonical data-driven Trading SBF adapter"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = ["families"]
no-entrypoint = []
custom-heap = []
custom-panic = []
# Link only the public read-only Shadow callback authenticator when Trading is
# consumed by an external accelerator. The canonical Trading executable never
# enables this feature.
# Diagnostic-only phase checkpoints for measured SBF compute profiling.
hot-cu-profile = []
series-family = [
    "dep:dclutch-custody",
]
dealer-family = [
    "dep:dclutch-custody",
]
families = [
    "series-family",
    "dealer-family",
]
# Test-only real-SBF profile that measures the common Hot outer without linking
# the Series, Dealer, or Direct family adapters. The common outer still owns
# the fixed Claims/Custody child composers and Token-2022 poststate verifier,
# so their dependency closure must remain explicit here rather than being
# inherited accidentally from the production `families` feature.
outer-only = [
    "dep:dclutch-custody",
]

[dependencies]
dclutch-vm = { path = "../../crates/dclutch-vm" }
dclutch-market = { path = "../../crates/dclutch-market", features = ["alloc"] }
dclutch-claims = { path = "../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../crates/dclutch-custody", optional = true }
dclutch-trading = { path = "../../crates/dclutch-trading", features = ["svm"] }
dclutch-product = { path = "../../crates/dclutch-product", features = ["svm"] }
dclutch-sbf-runtime = { path = "../../crates/dclutch-sbf-runtime" }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
dclutch-registry = { path = "../../crates/dclutch-registry", features = ["svm"] }
dclutch-source = { path = "../../crates/dclutch-source" }
dclutch-sha256-adapter = { path = "../../crates/dclutch-sha256-adapter" }
solana-program = { version = "=3.0.0", default-features = false }
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

# Off-chain only, exactly like the `series::activation_bundle_v1` module it
# serves: an activation triple is authored by release tooling and never by a
# program, and the SBF artifact must not be able to reach it even by accident.
[target.'cfg(not(target_os = "solana"))'.dependencies]
dclutch-market = { path = "../../crates/dclutch-market" }

[dev-dependencies]
dclutch-claims = { path = "../../crates/dclutch-claims" }
solana-hash = "=4.6.0"
solana-message = { version = "=3.1.0", features = ["bincode"] }

# The workspace lint set, with ONE deliberate change: `unsafe_code` is "deny"
# rather than "forbid" so that exactly one module -- `src/entrypoint_adapter.rs`,
# carrying the single `#[allow(unsafe_code)]` in this crate, on its `mod`
# declaration in `src/lib.rs` -- can hold the SBF loader's machine boundary.
#
# Why the exemption lives here and not in a separate crate: the loader's
# `entrypoint` symbol and the `#[global_allocator]` static must be *defined in
# the cdylib itself* to be reliably emitted (an unreferenced `#[no_mangle]` in a
# dependency rlib is collectable, and hiding it behind a macro would put the
# `unsafe` back into this crate's expansion invisibly, which is the opposite of
# a named boundary). A separate crate would also be a reusable facility other
# programs could adopt, widening the exemption from one named module to the
# whole tree.
#
# Every other lint is byte-identical to `[workspace.lints]` in the root
# Cargo.toml. Keep them in step.
# NOT `[lints] workspace = true`, for one reason: `unsafe_code` is `deny` here
# and `forbid` in the workspace table, and `entrypoint_adapter` carries a single
# `#[allow(unsafe_code)]` on its `mod` declaration (lib.rs:88) for the raw
# syscall and heap-scratch boundary. `forbid` cannot be overridden, so inheriting
# would stop this program compiling. Every other line below is the deny table
# verbatim and must be updated by hand if the root one moves.
[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
