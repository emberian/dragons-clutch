
[package]
name = "dclutch-trading-dealer-program-test"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[dependencies]
dclutch-trading = { path = "../../../crates/dclutch-trading" }
solana-account = "=4.6.0"
solana-instruction = "=3.5.0"
solana-keypair = "=3.1.2"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-pubkey = "=3.0.0"
solana-signer = "=3.0.1"
solana-transaction = "=4.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
