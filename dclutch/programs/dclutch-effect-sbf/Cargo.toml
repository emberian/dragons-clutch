[package]
name = "dclutch-effect-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Isolated SBF measurement adapter for Lean-owned dClutch effects"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-effect-kernel = { path = "../../crates/dclutch-effect-kernel" }
solana-program = { version = "=3.0.0", default-features = false }

[lints]
workspace = true
