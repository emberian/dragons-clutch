[package]
name = "dclutch-product-payoff-sbf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Thin authenticated SBF adapter for Lean-owned dClutch Product payoffs"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []

[dependencies]
dclutch-product-payoff-codec = { path = "../../crates/dclutch-product-payoff-codec" }
dclutch-product-payoff-svm = { path = "../../crates/dclutch-product-payoff-svm" }
dclutch-record-contract = { path = "../../crates/dclutch-record-contract" }
dclutch-registry-contract = { path = "../../crates/dclutch-registry-contract" }
dclutch-registry-svm = { path = "../../crates/dclutch-registry-svm" }
dclutch-release-set-contract = { path = "../../crates/dclutch-release-set-contract" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

[lints]
workspace = true
