[package]
name = "dclutch-dealer-accelerator-program-test"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.89"

[dependencies]
dclutch-account-profile-contract = { path = "../../../crates/dclutch-account-profile-contract" }
dclutch-capability-contract = { path = "../../../crates/dclutch-capability-contract" }
dclutch-capability-program-contract = { path = "../../../crates/dclutch-capability-program-contract" }
dclutch-chain-bundle-builder = { path = "../../dclutch-trading-sbf/program-test/bundle-builder" }
dclutch-claims-svm = { path = "../../../crates/dclutch-claims-svm" }
dclutch-core-contract = { path = "../../../crates/dclutch-core-contract" }
dclutch-custody-contract = { path = "../../../crates/dclutch-custody-contract" }
dclutch-dealer-codec = { path = "../../../crates/dclutch-dealer-codec" }
dclutch-dealer-accelerator-test-caller-sbf = { path = "../test-programs/dealer-caller", features = ["no-entrypoint"] }
dclutch-effect-kernel = { path = "../../../crates/dclutch-effect-kernel" }
dclutch-execution-strategy-contract = { path = "../../../crates/dclutch-execution-strategy-contract" }
dclutch-fractional-atomic-program-test = { path = "../../dclutch-claims-sbf/program-test/fractional-atomic" }
dclutch-market-core-codec = { path = "../../../crates/dclutch-market-core-codec" }
dclutch-operator = { path = "../../../crates/dclutch-operator" }
dclutch-versioned-message-operator = { path = "../../../crates/dclutch-versioned-message-operator" }
dclutch-program-test-evidence = { path = "../../../tools/gauntlet/program-test-evidence" }
dclutch-product-payoff-v2-codec = { path = "../../../crates/dclutch-product-payoff-v2-codec" }
dclutch-product-runtime-v2 = { path = "../../../crates/dclutch-product-runtime-v2" }
dclutch-product-runtime-v2-admission = { path = "../../../crates/dclutch-product-runtime-v2-admission" }
dclutch-realm-contract = { path = "../../../crates/dclutch-realm-contract" }
dclutch-refusal-registry = { path = "../../../crates/dclutch-refusal-registry" }
dclutch-record-contract = { path = "../../../crates/dclutch-record-contract" }
dclutch-registry-activation-auth-v1 = { path = "../../../crates/dclutch-registry-activation-auth-v1" }
dclutch-registry-contract = { path = "../../../crates/dclutch-registry-contract" }
dclutch-registry-svm = { path = "../../../crates/dclutch-registry-svm" }
dclutch-release-set-contract = { path = "../../../crates/dclutch-release-set-contract" }
dclutch-request-profile-contract = { path = "../../../crates/dclutch-request-profile-contract" }
dclutch-rent-contract = { path = "../../../crates/dclutch-rent-contract" }
dclutch-resolution-core-v3-operator = { path = "../../../crates/dclutch-resolution-core-v3-operator" }
dclutch-token-svm = { path = "../../../crates/dclutch-token-svm" }
dclutch-trading-sbf = { path = "../../dclutch-trading-sbf", default-features = false, features = ["dealer-family", "series-family", "no-entrypoint"] }
dclutch-transition-vm = { path = "../../../crates/dclutch-transition-vm" }
solana-account = "=4.6.0"
solana-clock = "=3.2.0"
solana-compute-budget-interface = "=3.1.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-message = "=4.5.0"
solana-message-v3 = { package = "solana-message", version = "=3.1.0", features = ["bincode"] }
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-program = "=3.0.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-transaction = "=4.2.0"
spl-token-interface = "=3.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
