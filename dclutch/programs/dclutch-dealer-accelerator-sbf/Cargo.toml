[package]
name = "dclutch-dealer-accelerator-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Readonly stateless admitted-AOT accelerator for Dealer scenario execution"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
# `custom-heap` is ON by default, and that is what makes the granted heap frame
# reachable at all. `solana_program::entrypoint!` expands `custom_heap_default!`,
# which installs `BumpAllocator::with_fixed_address_range(HEAP_START_ADDRESS,
# HEAP_LENGTH)` -- a hardcoded 32,768 that bumps DOWN from a compile-time
# ceiling -- unless THIS crate declares a feature by that exact name.
#
# This crate declared it and never implemented one, which is the SAME defect
# `dclutch-general-accelerator-sbf` was repaired for on 2026-09-01 and the same
# one its Cargo.toml already narrates. It was invisible here for longer because
# no route reached the allocation: the Dealer equity Add refused upstream, in
# the runtime transcript and then on an unsatisfiable tail conjunct. With both
# of those repaired the route arrived and the program died of
# `memory allocation failed, out of memory` after 331,928 CU -- an abort, not a
# refusal, which names nothing.
default = ["custom-heap"]
no-entrypoint = []
custom-heap = ["dep:dclutch-sbf-bump-heap"]
custom-panic = []

[dependencies]
dclutch-capability-program-contract = { path = "../../crates/dclutch-capability-program-contract" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-execution-strategy-contract = { path = "../../crates/dclutch-execution-strategy-contract" }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
dclutch-sbf-bump-heap = { path = "../../crates/dclutch-sbf-bump-heap", optional = true }
dclutch-trading-sbf = { path = "../dclutch-trading-sbf", default-features = false, features = ["dealer-family", "series-family", "no-entrypoint"] }
solana-program = { version = "=3.0.0", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
