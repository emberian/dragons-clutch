[package]
name = "dclutch-claims-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Thin authenticated SBF adapter for the canonical Claims owner"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []
# Diagnostic-only phase checkpoints for measured SBF compute profiling.
#
# OFF in every shipped build, and the canonical Claims executable is never
# built with it. It exists because a child program invoked by a CPI is one
# number in the caller's log, and one number cannot say whether it was spent on
# work only this program can do or on re-deriving what its caller already
# authenticated. `dclutch-trading-sbf`'s `hot-cu-profile` is the sibling; the
# two are separate features rather than one shared crate because Trading's also
# reports its bump allocator's outstanding heap, which this program does not
# have. Today this instruments the SignedDelta route only.
claims-cu-profile = ["dep:dclutch-cu-checkpoint"]

[dependencies]
dclutch-claims-svm = { path = "../../crates/dclutch-claims-svm" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-cu-checkpoint = { path = "../../crates/dclutch-cu-checkpoint", optional = true }
dclutch-custody-contract = { path = "../../crates/dclutch-custody-contract" }
dclutch-economic-slice-kernel = { path = "../../crates/dclutch-economic-slice-kernel" }
dclutch-fractional-claim-contract = { path = "../../crates/dclutch-fractional-claim-contract" }
dclutch-fractional-claim-kernel = { path = "../../crates/dclutch-fractional-claim-kernel" }
dclutch-fractional-claims-kernel = { path = "../../crates/dclutch-fractional-claims-kernel" }
dclutch-market-core-codec = { path = "../../crates/dclutch-market-core-codec" }
dclutch-product-contract = { path = "../../crates/dclutch-product-contract" }
dclutch-product-payoff-v2-codec = { path = "../../crates/dclutch-product-payoff-v2-codec" }
dclutch-product-runtime-v2 = { path = "../../crates/dclutch-product-runtime-v2" }
dclutch-product-runtime-v2-svm-reader = { path = "../../crates/dclutch-product-runtime-v2-svm-reader" }
dclutch-rational-representation-v2-contract = { path = "../../crates/dclutch-rational-representation-v2-contract" }
dclutch-rational-representation-v2-kernel = { path = "../../crates/dclutch-rational-representation-v2-kernel" }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
dclutch-representation-composition-v3-kernel = { path = "../../crates/dclutch-representation-composition-v3-kernel" }
dclutch-rational-representation-v2-lifecycle-contract = { path = "../../crates/dclutch-rational-representation-v2-lifecycle-contract" }
dclutch-resolution-codec = { path = "../../crates/dclutch-resolution-codec" }
dclutch-realm-contract = { path = "../../crates/dclutch-realm-contract" }
dclutch-record-contract = { path = "../../crates/dclutch-record-contract" }
dclutch-registry-activation-auth-v1 = { path = "../../crates/dclutch-registry-activation-auth-v1" }
dclutch-registry-contract = { path = "../../crates/dclutch-registry-contract" }
dclutch-registry-svm = { path = "../../crates/dclutch-registry-svm" }
dclutch-rent-contract = { path = "../../crates/dclutch-rent-contract" }
dclutch-release-set-contract = { path = "../../crates/dclutch-release-set-contract" }
dclutch-sha256-adapter = { path = "../../crates/dclutch-sha256-adapter" }
dclutch-source-contract = { path = "../../crates/dclutch-source-contract" }
dclutch-token-svm = { path = "../../crates/dclutch-token-svm" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
spl-associated-token-account-interface = { version = "=2.0.0", default-features = false }
spl-token-2022-interface = { version = "=3.1.1", default-features = false }

[dev-dependencies]
dclutch-account-profile-contract = { path = "../../crates/dclutch-account-profile-contract" }
dclutch-bearer-v2-operator = { path = "../../crates/dclutch-bearer-v2-operator" }
dclutch-capability-contract = { path = "../../crates/dclutch-capability-contract" }
dclutch-capability-program-contract = { path = "../../crates/dclutch-capability-program-contract" }
dclutch-chain-bundle-builder = { path = "../dclutch-trading-sbf/program-test/bundle-builder" }
dclutch-product-runtime-v2-admission = { path = "../../crates/dclutch-product-runtime-v2-admission" }
dclutch-program-test-evidence = { path = "../../tools/gauntlet/program-test-evidence" }
# The claim-check CLIENT. `claim_check_v1`'s builders are the tree's only
# client-side statement of the redemption and escrow-close frames, and this
# campaign used to restate both by hand -- two authors for one frame, with
# nothing checking they agreed. The campaign now calls the builders, so what
# executes against the real ELFs is the operator's own frame.
#
# `default-features = false` drops `dealer-series` and with it the only reason
# the crate links `dclutch-trading-sbf`: the claim-check planners need no
# program. DEV only; none of this reaches the cdylib and the ELF digest is the
# control.
dclutch-operator = { path = "../../crates/dclutch-operator", default-features = false }
# Structured V2's founding-time lowering, so the campaign's execution descriptor
# is DERIVED (decision 0011 §3c/§3d) rather than a sixth hand-written preimage.
# DEV only: none of these reach the cdylib, and the ELF digest is the control.
dclutch-fractional-claim-kernel = { path = "../../crates/dclutch-fractional-claim-kernel" }
dclutch-rational-representation-v2-operator = { path = "../../crates/dclutch-rational-representation-v2-operator" }
dclutch-rational-representation-v2-request-contract = { path = "../../crates/dclutch-rational-representation-v2-request-contract" }
dclutch-structured-v2-kernel = { path = "../../crates/dclutch-structured-v2-kernel" }
dclutch-structured-v2-contract = { path = "../../crates/dclutch-structured-v2-contract" }
dclutch-structured-v2-operator = { path = "../../crates/dclutch-structured-v2-operator" }
dclutch-trading-sbf = { path = "../dclutch-trading-sbf", features = ["no-entrypoint"] }
solana-account = "=4.6.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-message = "=4.5.0"
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-compute-budget-interface = "=3.1.0"
solana-sdk = "=3.0.0"
solana-transaction = "=4.2.0"
spl-token-interface = "=3.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
