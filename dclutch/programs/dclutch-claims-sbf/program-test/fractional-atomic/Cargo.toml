[package]
name = "dclutch-fractional-atomic-program-test"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-market = { path = "../../../../crates/dclutch-market" }
dclutch-claims-affine-batch-program-test = { path = "../affine-batch" }
dclutch-claims-sbf = { path = "../..", features = ["no-entrypoint"] }
dclutch-claims = { path = "../../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-custody = { path = "../../../../crates/dclutch-custody" }
dclutch-source = { path = "../../../../crates/dclutch-source" }
dclutch-claim-check-escrow-signer-test-sbf = { path = "../../test-programs/claim-check-escrow-signer", features = ["no-entrypoint"] }
dclutch-fractional-atomic-test-caller-sbf = { path = "../../test-programs/fractional-atomic-caller", features = ["no-entrypoint"] }
dclutch-product = { path = "../../../../crates/dclutch-product" }
dclutch-product-runtime-v2-operator = { path = "../../../../crates/dclutch-product-runtime-v2-operator" }
dclutch-registry = { path = "../../../../crates/dclutch-registry" }
dclutch-fractional-compaction-test-caller-sbf = { path = "../../test-programs/fractional-compaction-caller", features = ["no-entrypoint"] }
solana-program = { version = "=3.0.0" }
solana-sdk-ids = "=3.1.0"
# Normal dependencies rather than dev-dependencies: `campaign_support` plants
# accounts into a `ProgramTest`, and it lives in `src/` precisely so that both
# campaigns get one author for the on-chain formats it encodes by hand.
solana-account = "=4.6.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }

[dev-dependencies]
base64 = "0.22"
# The conservation campaign's two subjects. The contract owns the `DCLCNS01`
# wire the campaign submits; the economic-slice kernel is the OTHER account
# family the route reads its aggregate with, and the campaign has to build one
# of those with that family's own initializer rather than by hand.
dclutch-claims = { path = "../../../../crates/dclutch-claims" }
dclutch-product = { path = "../../../../crates/dclutch-product" }
dclutch-refusal-registry = { path = "../../../../crates/dclutch-refusal-registry" }
# The founding campaign: the Core permit and intent codec, and the Trading-role
# caller that is the only thing in this tree able to sign a founding authority.
dclutch-claims-founding-test-caller-sbf = { path = "../../test-programs/founding-caller", features = ["no-entrypoint"] }
# The census half. `record` is a no-op unless DCLUTCH_PROGRAM_TEST_EVIDENCE_DIR
# is set, so this campaign stays an ordinary `cargo test` and additionally emits
# the evidence `dclutch-route-census observe` corroborates a binding against.
dclutch-program-test-evidence = { path = "../../../../tools/gauntlet/program-test-evidence" }
dclutch-fractional-cubic-life-evidence = { path = "../../../../crates/dclutch-fractional-cubic-life-evidence" }
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }
spl-token-2022-interface = { version = "=3.1.1", default-features = false }
solana-sdk = "=3.0.0"
solana-transaction = "=4.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
