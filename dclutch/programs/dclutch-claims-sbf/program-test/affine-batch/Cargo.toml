[package]
name = "dclutch-claims-affine-batch-program-test"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-claims = { path = "../../../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-market = { path = "../../../../crates/dclutch-market" }
dclutch-product = { path = "../../../../crates/dclutch-product" }
dclutch-product-runtime-v2-operator = { path = "../../../../crates/dclutch-product-runtime-v2-operator" }
dclutch-registry = { path = "../../../../crates/dclutch-registry" }
solana-program = { version = "=3.0.0" }
solana-sdk-ids = "=3.1.0"

[dev-dependencies]
dclutch-program-test-evidence = { path = "../../../../tools/gauntlet/program-test-evidence" }
dclutch-refusal-registry = { path = "../../../../crates/dclutch-refusal-registry" }
solana-account = "=4.3.2"
solana-address-lookup-table-interface = { version = "=3.1.0", features = ["bincode", "bytemuck"] }
solana-message = "=4.4.1"
solana-program-test = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-transaction = "=4.1.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
