[package]
name = "dclutch-custody-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Thin authenticated SBF adapter for canonical dClutch custody"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []
# Diagnostic-only phase checkpoints for measured SBF compute profiling.
#
# OFF in every shipped build, and the canonical Custody executable is never
# built with it. The third of its kind, after `dclutch-trading-sbf`'s
# `hot-cu-profile` and `dclutch-claims-sbf`'s `claims-cu-profile`, and it exists
# for the same reason both of those did: this program is ONE number in its
# caller's log. On the Dealer partial equity Remove that number is 116,203 CU of
# a 1,399,700 ceiling, spent to move 105 CU of tokens, and nothing in this tree
# could say what the difference was. Today this instruments the Dealer scenario
# reservation route only -- the leg that Remove actually calls.
custody-cu-profile = ["dep:dclutch-sbf-runtime"]

[dependencies]
dclutch-market = { path = "../../crates/dclutch-market" }
dclutch-claims = { path = "../../crates/dclutch-claims" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-sbf-runtime = { path = "../../crates/dclutch-sbf-runtime", optional = true }
dclutch-custody = { path = "../../crates/dclutch-custody" }
dclutch-registry = { path = "../../crates/dclutch-registry", features = ["svm"] }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

[dev-dependencies]
dclutch-program-test-evidence = { path = "../../tools/gauntlet/program-test-evidence" }
# The delegated-custody CLIENT. `delegated_custody_transfer_cpi_v2` is the
# tree's only client-side statement of `custody/delegated::process`, and this
# campaign used to restate its 14-account frame here -- which is how the builder
# shipped a Realm DIGEST where the chain requires the Realm RECORD without any
# campaign noticing. The campaign drives the builder now, so the frame the real
# Custody ELF admits is the one an operator would actually send.
#
# `default-features = false` drops `dealer-series` and with it the only reason
# the crate links `dclutch-trading-sbf`. DEV only; none of it reaches the
# cdylib, and the ELF digest is the control.
dclutch-operator = { path = "../../crates/dclutch-operator", default-features = false }
solana-account = "=4.6.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-message = "=4.5.0"
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-transaction = "=4.2.0"
spl-token-interface = "=3.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
