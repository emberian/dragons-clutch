[package]
name = "dclutch-general-accelerator-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Readonly stateless admitted-AOT accelerator for General clearing"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
# `custom-heap` is ON by default, and that is what makes the granted heap frame
# reachable at all. `solana_program::entrypoint!` expands `custom_heap_default!`,
# which installs `BumpAllocator::with_fixed_address_range(HEAP_START_ADDRESS,
# HEAP_LENGTH)` -- a hardcoded 32,768 that bumps DOWN from a compile-time
# ceiling -- unless THIS crate declares a feature by that exact name. The
# feature was declared here and never implemented, so for as long as that stood
# the program ran on 32 KiB while its transactions granted 65,536: half the
# frame it paid for was never addressable. Turning the feature off hands the
# heap back to the SDK's allocator and reinstates that ceiling.
default = ["custom-heap"]
no-entrypoint = []
custom-heap = ["dep:dclutch-sbf-bump-heap"]
custom-panic = []
# Diagnostic-only. Logs the program allocator's outstanding bytes against the
# ceiling it actually enforces -- which, with `custom-heap` on, IS the lifted
# frame. Never enabled in a shipped artifact; the campaign builds without it.
heap-profile = []

[dependencies]
dclutch-capability-program-contract = { path = "../../crates/dclutch-capability-program-contract" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-execution-strategy-contract = { path = "../../crates/dclutch-execution-strategy-contract" }
dclutch-general-adapter-contract = { path = "../../crates/dclutch-general-adapter-contract" }
dclutch-general-codec = { path = "../../crates/dclutch-general-codec" }
dclutch-general-config-contract = { path = "../../crates/dclutch-general-config-contract" }
solana-instructions-sysvar = "=3.0.1"
solana-compute-budget-interface = "=3.1.0"
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"

dclutch-sbf-bump-heap = { path = "../../crates/dclutch-sbf-bump-heap", optional = true }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }

[lints]
workspace = true
