[package]
name = "dclutch-series-consume-caller-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []

[dependencies]
dclutch-claims = { path = "../../../../crates/dclutch-claims" }
dclutch-market = { path = "../../../../crates/dclutch-market" }
dclutch-registry = { path = "../../../../crates/dclutch-registry" }
dclutch-trading = { path = "../../../../crates/dclutch-trading" }
solana-program = { version = "=3.0.0", default-features = false }
[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(target_os, values("solana"))'] }
