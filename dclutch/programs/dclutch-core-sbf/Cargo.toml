[package]
name = "dclutch-core-sbf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Thin authenticated SBF adapter for canonical dClutch Market Core"

[lib]
crate-type = ["cdylib", "lib"]
path = "src/lib.rs"

[features]
default = []
no-entrypoint = []
custom-heap = []
custom-panic = []
# Diagnostic-only dump of the founding permit's own preimages.
#
# OFF in every shipped build, and the canonical Core executable is never built
# with it. The Claims sibling `claims-founding-probe` emits the intent the
# permit CARRIES; this emits the two things Core hashed to build it -- the
# candidate `CoreState` the Found stage will write, and the intent projection
# itself -- because when the founding refuses on the intent digest, the
# supervisor's disagreement can be one coordinate of a state that does not
# exist on chain yet and that no receipt reproduces byte for byte.
core-founding-probe = []

[dependencies]
dclutch-market = { path = "../../crates/dclutch-market" }
dclutch-core-contract = { path = "../../crates/dclutch-core-contract" }
dclutch-claims = { path = "../../crates/dclutch-claims" }
dclutch-custody = { path = "../../crates/dclutch-custody" }
dclutch-product = { path = "../../crates/dclutch-product", features = ["svm"] }
dclutch-registry = { path = "../../crates/dclutch-registry", features = ["svm"] }
dclutch-refusal-registry = { path = "../../crates/dclutch-refusal-registry" }
dclutch-source = { path = "../../crates/dclutch-source" }
dclutch-trading = { path = "../../crates/dclutch-trading" }
solana-program = { version = "=3.0.0", default-features = false }
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

[dev-dependencies]
dclutch-trading = { path = "../../crates/dclutch-trading" }
dclutch-operator = { path = "../../crates/dclutch-operator" }
dclutch-market-open-v1-operator = { path = "../../crates/dclutch-market-open-v1-operator" }
dclutch-resolution-core-v3-operator = { path = "../../crates/dclutch-resolution-core-v3-operator" }
dclutch-registry-sbf = { path = "../dclutch-registry-sbf", features = ["no-entrypoint"] }
dclutch-trading-sbf = { path = "../dclutch-trading-sbf", features = ["no-entrypoint"] }
dclutch-program-test-evidence = { path = "../../tools/gauntlet/program-test-evidence" }
dclutch-product = { path = "../../crates/dclutch-product" }
dclutch-product-runtime-v2-operator = { path = "../../crates/dclutch-product-runtime-v2-operator" }
base64 = "0.22"
serde_json = "1"
solana-account = "=4.6.0"
solana-address-lookup-table-interface = "=3.2.0"
solana-compute-budget-interface = "=3.1.0"
solana-hash = "=4.6.0"
solana-message = "=4.5.0"
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-program-test = { version = "=4.3.0-beta.2", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-transaction = "=4.2.0"
spl-token-interface = "=3.0.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
