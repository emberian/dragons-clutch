[package]
name = "dclutch-dealer-family-program-test"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.89"

[dependencies]
dclutch-dealer-sbf = { path = "..", features = ["no-entrypoint"] }
dclutch-dealer-codec = { path = "../../../crates/dclutch-dealer-codec" }
dclutch-program-test-evidence = { path = "../../../tools/gauntlet/program-test-evidence" }
solana-account = "=4.3.2"
solana-program = "=3.0.0"
solana-program-test = { version = "=4.2.1", features = ["agave-unstable-api"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-transaction = "=4.1.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
