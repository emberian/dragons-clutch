[workspace]
members = [
    "crates/dclutch-account-profile-contract",
    "crates/dclutch-bearer-contract",
    "crates/dclutch-capability-contract",
    "crates/dclutch-capability-program-contract",
    "crates/dclutch-claims-svm",
    "crates/dclutch-collateral-contract",
    "crates/dclutch-core-contract",
    "crates/dclutch-custody-contract",
    "crates/dclutch-dealer-codec",
    "crates/dclutch-dealer-contract",
    "crates/dclutch-direct-contract",
    "crates/dclutch-direct-codec",
    "crates/dclutch-economic-adapter-contract",
    "crates/dclutch-economic-kernel",
    "crates/dclutch-economic-slice-kernel",
    "crates/dclutch-effect-kernel",
    "crates/dclutch-general-contract",
    "crates/dclutch-general-config-contract",
    "crates/dclutch-general-adapter-contract",
    "crates/dclutch-general-codec",
    "crates/dclutch-kernel",
    "crates/dclutch-liability-basis-v2-kernel",
    "crates/dclutch-market-contract",
    "crates/dclutch-market-core-codec",
    "crates/dclutch-operator",
    "crates/dclutch-pyth-svm",
    "crates/dclutch-pyth-contract",
    "crates/dclutch-product-compiler",
    "crates/dclutch-product-contract",
    "crates/dclutch-product-admission-contract",
    "crates/dclutch-product-payoff-codec",
    "crates/dclutch-product-payoff-svm",
    "crates/dclutch-product-payoff-v2-codec",
    "crates/dclutch-product-payoff-v2-svm",
    "crates/dclutch-record-contract",
    "crates/dclutch-registry-contract",
    "crates/dclutch-registry-svm",
    "crates/dclutch-release-set-contract",
    "crates/dclutch-release-tool",
    "crates/dclutch-resolution-codec",
    "crates/dclutch-realm-contract",
    "crates/dclutch-rent-contract",
    "crates/dclutch-series-contract",
    "crates/dclutch-source-contract",
    "crates/dclutch-structured-contract",
    "crates/dclutch-terminal-contract",
    "crates/dclutch-token-svm",
    "crates/dclutch-transition-vm",
    "programs/dclutch-effect-sbf",
    "programs/dclutch-controller-proof-sbf",
    "programs/dclutch-claims-proof-sbf",
    "programs/dclutch-custody-proof-sbf",
    "programs/dclutch-economic-sbf",
    "programs/dclutch-resolution-proof-sbf",
    "programs/dclutch-registry-sbf",
    "programs/dclutch-product-payoff-sbf",
    "programs/dclutch-product-evidence-sbf",
    "programs/dclutch-sbf",
    "programs/dclutch-trading-sbf",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
