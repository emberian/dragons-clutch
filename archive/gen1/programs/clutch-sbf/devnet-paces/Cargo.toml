# Public-devnet paces driver for the Dragon's Clutch market lifecycle.
#
# This is intentionally not a member of the SBF build workspace, exactly like
# `committed-harness`: the program ELF must not acquire host signing, JSON, or
# HTTP-adjacent dependencies merely because a devnet driver needs them.  It
# reuses `clutch-sbf-svm-tests`'s fixture library so that every artifact body,
# request envelope, and account expectation comes from the same encoders the
# program decodes with.
[workspace]

[patch.crates-io]
solana-define-syscall = { path = "../vendor/solana-define-syscall-5.1.0" }

[package]
name = "clutch-sbf-devnet-paces"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "Devnet paces driver: public-cluster lifecycle prefix plus asserted refusal boundaries"

[[bin]]
name = "devnet-paces"
path = "src/main.rs"

[dependencies]
clutch-sbf = { path = "../program" }
clutch-sbf-svm-tests = { path = "../svm-tests" }
clutch-collateral-adapter-v2 = { path = "../../../crates/clutch-collateral-adapter-v2" }
clutch-kernel = { path = "../../../crates/clutch-kernel" }
clutch-solana-layout = { path = "../../solana-layout" }
clutch-solana-reference = { path = "../../solana-reference" }

# The exact dependency set `svm-tests` already proves coherent on this host.
solana-address = { version = "=2.6.1", features = ["curve25519"] }
solana-instruction = "=3.4.1"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = { version = "=4.1.6", features = ["blake3", "serde"] }
solana-hash = "=4.5.0"
solana-program-pack = "=3.1.0"
spl-token-2022-interface = "=3.1.1"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

bincode = "=1.3.3"
base64 = "=0.22.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# One driver, one long walk: splitting the executor into artificial helpers to
# satisfy a line counter would hide the step order this binary exists to show.
too_many_lines = "allow"
module_name_repetitions = "allow"
