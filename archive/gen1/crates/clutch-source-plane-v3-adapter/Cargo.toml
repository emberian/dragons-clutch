[package]
name = "clutch-source-plane-v3-adapter"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Allocation-free adapter contract and transition projections for SourcePlane V3"

[lib]
path = "src/lib.rs"

[dependencies]
clutch-source-plane-v3 = { path = "../clutch-source-plane-v3" }
clutch-source-profile-v1 = { path = "../../research/source-profile-v1" }
clutch-terminal-identity-v1 = { path = "../../research/terminal-identity-v1" }
sha2 = { version = "0.10.9", default-features = false }

[features]
default = []

[dev-dependencies]
serde_json = "1.0"
