[package]
name = "dclutch-route-census"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false

# The gauntlet's census is a host analysis tool. It deliberately resolves
# independently of the protocol workspace: it must be able to read a source tree
# it does not build, including a `git archive` snapshot of a commit whose
# manifests differ from the checkout's.
[workspace]

[[bin]]
name = "dclutch-route-census"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
syn = { version = "=2.0.119", features = ["full", "parsing", "printing", "extra-traits", "visit"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
panic = "abort"
