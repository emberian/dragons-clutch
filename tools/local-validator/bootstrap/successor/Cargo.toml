[package]
name = "dclutch-local-successor-bootstrap"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false

# This localhost-only host utility deliberately resolves independently from the
# protocol workspace and the older provider bootstrap package.
[workspace]

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
dclutch-core-contract = { path = "../../../../crates/dclutch-core-contract" }
dclutch-capability-contract = { path = "../../../../crates/dclutch-capability-contract" }
dclutch-capability-program-contract = { path = "../../../../crates/dclutch-capability-program-contract" }
dclutch-capability-seal-contract = { path = "../../../../crates/dclutch-capability-seal-contract" }
dclutch-claims-svm = { path = "../../../../crates/dclutch-claims-svm" }
dclutch-custody-contract = { path = "../../../../crates/dclutch-custody-contract" }
dclutch-direct-codec = { path = "../../../../crates/dclutch-direct-codec" }
dclutch-market-core-codec = { path = "../../../../crates/dclutch-market-core-codec" }
dclutch-market-founding-v1-operator = { path = "../../../../crates/dclutch-market-founding-v1-operator" }
dclutch-market-retirement-v1-operator = { path = "../../../../crates/dclutch-market-retirement-v1-operator" }
dclutch-operator = { path = "../../../../crates/dclutch-operator" }
dclutch-product-runtime-v2 = { path = "../../../../crates/dclutch-product-runtime-v2" }
dclutch-product-payoff-v2-codec = { path = "../../../../crates/dclutch-product-payoff-v2-codec" }
dclutch-product-runtime-v2-admission = { path = "../../../../crates/dclutch-product-runtime-v2-admission" }
dclutch-product-runtime-v2-operator = { path = "../../../../crates/dclutch-product-runtime-v2-operator" }
dclutch-pyth-svm = { path = "../../../../crates/dclutch-pyth-svm", features = ["synthetic-local-fixture"] }
dclutch-realm-contract = { path = "../../../../crates/dclutch-realm-contract" }
dclutch-record-contract = { path = "../../../../crates/dclutch-record-contract" }
dclutch-registry-contract = { path = "../../../../crates/dclutch-registry-contract" }
dclutch-registry-activation-auth-v1 = { path = "../../../../crates/dclutch-registry-activation-auth-v1" }
dclutch-registry-svm = { path = "../../../../crates/dclutch-registry-svm" }
dclutch-representation-composition-v3-kernel = { path = "../../../../crates/dclutch-representation-composition-v3-kernel" }
dclutch-representation-composition-v3-operator = { path = "../../../../crates/dclutch-representation-composition-v3-operator" }
dclutch-relay-contract = { path = "../../../../crates/dclutch-relay-contract" }
dclutch-release-set-contract = { path = "../../../../crates/dclutch-release-set-contract" }
dclutch-release-tool = { path = "../../../../crates/dclutch-release-tool" }
dclutch-rational-representation-v2-kernel = { path = "../../../../crates/dclutch-rational-representation-v2-kernel" }
dclutch-rent-contract = { path = "../../../../crates/dclutch-rent-contract" }
dclutch-resolution-codec = { path = "../../../../crates/dclutch-resolution-codec" }
dclutch-resolution-core-v3-operator = { path = "../../../../crates/dclutch-resolution-core-v3-operator" }
dclutch-source-contract = { path = "../../../../crates/dclutch-source-contract" }
dclutch-token-svm = { path = "../../../../crates/dclutch-token-svm" }
dclutch-versioned-message-operator = { path = "../../../../crates/dclutch-versioned-message-operator" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
solana-hash = "=4.6.0"
solana-address-lookup-table-interface = { version = "=3.2.0", features = ["bincode", "bytemuck"] }
solana-compute-budget-interface = "=3.1.0"
solana-program = { version = "=3.0.0", default-features = false }
solana-loader-v3-interface = { version = "=6.1.0", features = ["bincode"] }
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.1.0"
solana-system-interface = { version = "=2.0.0", features = ["bincode"] }

[lints.rust]
unsafe_code = "forbid"
