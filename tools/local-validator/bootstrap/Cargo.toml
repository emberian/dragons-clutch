[package]
name = "dclutch-local-provider-bootstrap"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
publish = false

# This host utility is intentionally not a member of the protocol workspace.
[workspace]

[dependencies]
base64 = "=0.22.1"
bincode = "=1.3.3"
dclutch-pyth-svm = { path = "../../../crates/dclutch-pyth-svm" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
solana-sdk = "=3.0.0"

[lints.rust]
unsafe_code = "forbid"
