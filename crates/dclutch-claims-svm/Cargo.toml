[package]
name = "dclutch-claims-svm"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Runtime-width Claims child packet and receipt ABI"

[dependencies]
dclutch-effect-kernel = { path = "../dclutch-effect-kernel" }
dclutch-product-payoff-v2-codec = { path = "../dclutch-product-payoff-v2-codec" }
dclutch-rational-representation-v2-kernel = { path = "../dclutch-rational-representation-v2-kernel" }
dclutch-rational-representation-v2-lifecycle-contract = { path = "../dclutch-rational-representation-v2-lifecycle-contract" }
dclutch-rational-representation-v2-request-contract = { path = "../dclutch-rational-representation-v2-request-contract" }

[dev-dependencies]
dclutch-token-svm = { path = "../dclutch-token-svm" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
