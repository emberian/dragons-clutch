[package]
name = "dclutch-bearer-v2-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Basis-vector specialization of dClutch Rational Representation V2"

[dependencies]
dclutch-rational-representation-v2-contract = { path = "../dclutch-rational-representation-v2-contract" }
dclutch-rational-representation-v2-kernel = { path = "../dclutch-rational-representation-v2-kernel" }
dclutch-representation-composition-v3-kernel = { path = "../dclutch-representation-composition-v3-kernel" }

[dev-dependencies]
dclutch-token-svm = { path = "../dclutch-token-svm" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
