[package]
name = "dclutch-custody-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Generated fixed-layout contract for canonical dClutch collateral custody"

[dependencies]
dclutch-market-core-codec = { path = "../dclutch-market-core-codec" }
dclutch-release-set-contract = { path = "../dclutch-release-set-contract" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
