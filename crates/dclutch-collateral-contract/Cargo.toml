[package]
name = "dclutch-collateral-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-realm-contract = { path = "../dclutch-realm-contract" }

# This bounded lane is deliberately its own workspace until canonical
# integration adds it to the repository workspace in one coordinated edit.
[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
