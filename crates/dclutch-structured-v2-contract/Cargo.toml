[package]
name = "dclutch-structured-v2-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Wire records and onchain-safe execution candidate for shard-backed Structured receipts"
publish = false

[dependencies]
dclutch-fractional-claim-kernel = { path = "../dclutch-fractional-claim-kernel" }
dclutch-structured-v2-kernel = { path = "../dclutch-structured-v2-kernel" }

[dev-dependencies]
sha2 = "=0.10.9"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
