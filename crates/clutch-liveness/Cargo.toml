[package]
name = "clutch-liveness"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"
description = "Pure prepaid-liveness admission kernel for Dragon's Clutch"

[lib]
path = "src/lib.rs"

[features]
default = []

[dev-dependencies]
# Differential oracle for the selected composite fee shape.  This remains
# test-only so the pure liveness kernel keeps no price or batch dependency.
clutch-batch = { path = "../clutch-batch" }
