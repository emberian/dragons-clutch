[package]
name = "dclutch-general-config-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Lean-owned immutable General capability configuration"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-capability-contract = { path = "../dclutch-capability-contract" }
dclutch-core-contract = { path = "../dclutch-core-contract" }

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
panic = "deny"
