[package]
name = "dclutch-rational-representation-v2-lifecycle-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Exact activation and retirement semantics for Rational Representation V2 resources"

[dependencies]
dclutch-rational-representation-v2-kernel = { path = "../dclutch-rational-representation-v2-kernel" }
dclutch-token-svm = { path = "../dclutch-token-svm" }

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
