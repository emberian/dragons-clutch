[package]
name = "dclutch-series-v3-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SDK-free fixed-memory kernel for recurring Series V3 records"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-market-core-codec = { path = "../dclutch-market-core-codec" }
dclutch-rent-contract = { path = "../dclutch-rent-contract" }
dclutch-sha256-adapter = { path = "../dclutch-sha256-adapter" }

# Test-only, and deliberately the OTHER implementation: the unit tests
# recompute these preimages against a library the kernel no longer links, so an
# agreement is two implementations agreeing rather than one talking to itself.
[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[lints]
workspace = true
