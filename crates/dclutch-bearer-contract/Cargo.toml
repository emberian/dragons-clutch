[workspace]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"

[package]
name = "dclutch-bearer-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-capability-contract = { path = "../dclutch-capability-contract" }
dclutch-core-contract = { path = "../dclutch-core-contract" }
dclutch-market-contract = { path = "../dclutch-market-contract" }
dclutch-product-contract = { path = "../dclutch-product-contract" }
dclutch-realm-contract = { path = "../dclutch-realm-contract" }
dclutch-token-svm = { path = "../dclutch-token-svm" }

[lints]
workspace = true
