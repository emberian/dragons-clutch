[package]
name = "dclutch-dealer-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[dependencies]
dclutch-core-contract = { path = "../dclutch-core-contract" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"

# This keeps the isolated lane directly testable before root workspace integration.
[workspace]
