[package]
name = "dclutch-direct-aot-v3-contract"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Stateless AOT translation of current Direct TransitionVMV3 programs"

[dependencies]
dclutch-direct-codec = { path = "../dclutch-direct-codec" }

[dev-dependencies]
dclutch-transition-vm = { path = "../dclutch-transition-vm" }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(target_os, values("solana"))'] }

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
