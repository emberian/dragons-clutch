[package]
name = "dclutch-product-compiler"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Deterministic exact-integer compiler for bounded dClutch Product contracts"

[dependencies]
dclutch-product-contract = { path = "../dclutch-product-contract" }
sha2 = "=0.10.9"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"

# This crate is intentionally not yet a root-workspace member.  It can evolve
# as a host-side construction tool without changing the on-chain workspace.
[workspace]
