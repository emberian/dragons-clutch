[package]
name = "dclutch-bearer-v2-operator"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"
description = "Chain-derived Rational Representation V2 specialization gate for Bearer claims"

[dependencies]
dclutch-bearer-v2-contract = { path = "../dclutch-bearer-v2-contract" }
dclutch-effect-kernel = { path = "../dclutch-effect-kernel" }
dclutch-rational-representation-v2-contract = { path = "../dclutch-rational-representation-v2-contract" }
dclutch-rational-representation-v2-kernel = { path = "../dclutch-rational-representation-v2-kernel" }
dclutch-rational-representation-v2-operator = { path = "../dclutch-rational-representation-v2-operator" }
dclutch-request-profile-contract = { path = "../dclutch-request-profile-contract" }
dclutch-transition-vm = { path = "../dclutch-transition-vm" }
solana-program = { version = "=3.0.0", default-features = false }

[dev-dependencies]
dclutch-token-svm = { path = "../dclutch-token-svm" }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
checked_conversions = "deny"
float_arithmetic = "deny"
indexing_slicing = "deny"
panic = "deny"
unwrap_used = "deny"
