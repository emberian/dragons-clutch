# Publish the dClutch public face to GitHub Pages: the real frontend's static
# export plus the generated protocol reference and guides, assembled by
# dclutch/tools/genref/render-site.mjs (which link-checks the artifact and
# refuses it on any broken internal link). This replaces the gen-1 microsite
# in archive/gen1/site/, which is no longer published.
#
# Publication is deliberately manual. A repository push is not release or
# publication authority, and the site describes an unreleased local
# implementation rather than an official deployment — the landing page and
# every rendered page carry that labeling.
#
# Two facts to know before dispatching:
#   - This builds from the dclutch/ SUBTREE. If the subtree lags the live
#     tree (it is updated in waves), the build fails or publishes stale
#     truth; refresh the subtree first.
#   - THE APP IS THE SITE. It is mounted at the artifact root, where the URLs
#     its export emits already point (`/_next/…` for assets, `/markets` and
#     friends for navigation), and the rendered documentation is a section of
#     it at /docs/. This REQUIRES a custom domain: served under the default
#     /<repo>/ project-page subpath, nothing in the app resolves. Neither of
#     vinext 1.0.0-beta.3's relocation knobs can save a subpath — basePath is
#     incompatible with output:'export' (its prerenderer skips every route),
#     and assetPrefix moves assets without moving routes. See
#     dclutch/apps/dclutch-web/next.config.ts for the measurements.
#     Mounting the app under /app/ was the 2026-08-27 breakage: pages asking
#     for /_next/… while the assets sat at /app/_next/…, so every workspace
#     served raw unstyled HTML and never hydrated. render-site.mjs now
#     link-checks the app's own pages, which is what would have caught it.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the frontend static export
        working-directory: dclutch/apps/dclutch-web
        env:
          # The rendered documentation ships in this artifact, so the app's
          # landing links to the pages a reader can actually open. Unset (dev,
          # the Cloudflare worker) it links the Markdown in the repository
          # instead — see apps/dclutch-web/lib/flags.ts.
          NEXT_PUBLIC_DCLUTCH_DOCS_BASE: /docs
        run: |
          npm ci
          DCLUTCH_PAGES_EXPORT=1 npm run build
      - name: Assemble and link-check the site
        run: |
          node dclutch/tools/genref/render-site.mjs \
            --out _site \
            --app dclutch/apps/dclutch-web/dist/client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
      - id: deployment
        uses: actions/deploy-pages@v4
