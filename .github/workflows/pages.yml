# Publish the hand-authored microsite in site/ to GitHub Pages, verbatim.
# There is no build step: the directory is uploaded as-is.
#
# Publication is deliberately manual. A repository push is not release or
# publication authority, and the site currently describes an unreleased local
# implementation rather than an official deployment.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check local links and static asset boundary
        run: python3 scripts/check_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
