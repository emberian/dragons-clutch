# The repository's first CI. Deliberately a seed, not a pipeline.
#
# Before this there was none at all: `pages.yml` publishes on manual dispatch
# and checks nothing, so every gate this project owns — and it owns a lot of
# good ones — ran only when a human remembered to run it.
#
# WHAT THIS BUILDS AGAINST, and it changes what the results mean: the `dclutch/`
# directory here is a SUBTREE, vendored from its working tree in waves. It
# therefore LAGS, by construction and on purpose. Two consequences that shaped
# every choice below:
#
#   - This checks WHAT IS PUBLISHED TO THE WORLD, which is a genuinely useful
#     question and not the same one the live tree answers.
#   - A drift gate against a deliberately-lagging snapshot measures the LAG,
#     not correctness. So where a tool distinguishes "this is wrong" from
#     "this is stale", this workflow gates on the first and only reports the
#     second. Gating on staleness here would produce a permanently red build
#     that everyone learns to ignore, which is worse than no CI.
#
# WHAT IS DELIBERATELY NOT HERE:
#
#   - No Lean build. The `check-generated.sh` byte-identity scripts and the
#     four `lean-emit.mjs` verifiers all shell out to `lake`. That is not
#     unaffordable — `formal/dclutch-semantics` pulls no mathlib and no
#     external dependencies at all — but it is minutes, and it belongs on a
#     tier that has earned it rather than in the first CI this repo has ever
#     had. In the live tree it runs as a pre-push hook instead; see
#     `dclutch/tools/emission-guard/README.md`.
#   - No SBF/cargo-build job, no validator, no devnet traffic. Nothing here
#     signs, submits, deploys, or publishes anything.
#
# HONESTY ABOUT WHAT WAS VERIFIED BEFORE THIS LANDED: the `hygiene` job's
# steps were run locally against this repository's committed subtree, and the
# SBOM classification gate passes there (failures=0, with drift=True — the
# subtree lag described above, which is why it is reported and not gated).
# The `suites` job's exact vitest invocations were validated locally for
# their exclusion behaviour, but the suites themselves have NOT been run
# against this subtree. The first run of this workflow is the real test of
# that job, and it may well find something. That is the workflow working.
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: repository hygiene (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # WHY A JOB NAMED "no build" NOW WARMS A CARGO REGISTRY.
      #
      # `sbom_check.py` resolves every workspace with `cargo metadata --locked
      # --offline`. The `--offline` is deliberate and should stay: the tool's
      # committed output must be byte-stable and must not depend on what a
      # network returns on a given morning. But offline resolution reads the
      # LOCAL registry cache, and a fresh hosted runner has none.
      #
      # So this gate reported `failures=50` against main, and every one of the
      # fifty was the same shape:
      #
      #     no matching package named `solana-program` found
      #     location searched: crates.io index
      #     note: offline mode (via `--offline`) can sometimes cause
      #           surprising resolution failures
      #
      # None of that is a license finding. It is the gate saying it could not
      # read the dependency graph at all — while `status=STOP`, a red X and the
      # words "SBOM reports classification failures" claimed it had. Three
      # manifests out of fifty-three were examined; the other fifty were
      # reported as though they had been. A gate that fails for a reason
      # unrelated to the thing it gates is worse than no gate, because the
      # eventual fix is someone widening it until the red goes away.
      #
      # `cargo fetch --locked` populates exactly what offline resolution needs
      # and nothing more: it downloads, it does not build. Measured against an
      # empty CARGO_HOME, this takes the gate from
      #
      #     manifests=3   unique_rows=826    failures=50  unresolvable=0
      # to  manifests=49  unique_rows=2054   failures=0   unresolvable=4
      #
      # The second effect is the one actually worth having. With a warm
      # registry a genuinely stale lock stops looking like the above and starts
      # producing cargo's own "because --locked was passed to prevent this",
      # which `sbom_check.py` already routes to `unresolvable` instead of
      # `failures` (its STALE_LOCK_MARKER). Those four are real, reportable
      # debt owed by the lanes that own those locks — and a different defect
      # from a license question, which is why they warn instead of failing.
      # The tool's classification was never wrong. Its environment was.
      # -------------------------------------------------------------------
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: sbom-registry-${{ hashFiles('dclutch/**/Cargo.lock') }}
          restore-keys: sbom-registry-

      - name: Warm the registry the SBOM gate resolves against
        working-directory: dclutch
        run: |
          # Exactly the set sbom_check.py visits: a tracked Cargo.toml with a
          # Cargo.lock beside it. Deliberately not fatal on a single refusal —
          # that is a real finding about one workspace's lock, and it is handed
          # to the gate below to classify rather than aborting the job before
          # the gate gets to speak at all.
          warmed=0
          refused=0
          for manifest in $(git ls-files '*Cargo.toml'); do
            [ -f "$(dirname "$manifest")/Cargo.lock" ] || continue
            if cargo fetch --locked --manifest-path "$manifest" >/dev/null 2>warm.err; then
              warmed=$((warmed + 1))
            else
              refused=$((refused + 1))
              echo "fetch refused: $manifest"
              sed -n '1,3p' warm.err | sed 's/^/    /'
            fi
          done
          rm -f warm.err
          echo "registry warmed for $warmed workspaces; $refused refused"
          echo "registry warmed for $warmed workspaces; $refused refused" >> "$GITHUB_STEP_SUMMARY"
          if [ "$refused" -gt 0 ]; then
            echo "::warning::$refused workspace(s) would not fetch under --locked. Their locks do not match their manifests; the gate below reports what that costs in coverage."
          fi

      - name: SBOM classification (gate) and drift (report)
        working-directory: dclutch
        run: |
          set -o pipefail
          python3 tools/sbom/sbom_check.py --verify > sbom.log 2>&1 || true
          summary=$(grep '^SUMMARY' sbom.log | tail -1)
          echo "$summary"
          grep '^FAILURE' sbom.log || true

          # Coverage as a number, not a vibe. `manifests=` is how many workspace
          # roots were actually resolved and classified, and it is printed so
          # that "green" is never separable from "and it looked at this many
          # things" — which is the exact failure this step was built to stop
          # making.
          resolved=$(printf '%s\n' "$summary" | grep -o 'manifests=[0-9]*' | cut -d= -f2)
          echo "SBOM resolved and classified $resolved workspace roots" >> "$GITHUB_STEP_SUMMARY"

          # An offline-resolution failure AFTER the warm-up above is no longer
          # explainable as an empty registry, so it is no longer excused. It
          # means a lock names something unfetchable. Still a real finding — it
          # just gets its own accurate sentence instead of being filed as a
          # license problem.
          stranded=$(grep -c 'offline mode' sbom.log || true)
          if [ "$stranded" -gt 0 ]; then
            echo "::error::$stranded manifest(s) still would not resolve offline after the registry was warmed — a lock references a package that cannot be fetched. That is a reproducibility defect, NOT a license classification finding; do not fix it by widening the license gate."
          fi

          # The gate proper: a genuinely unclassified license, a forbidden
          # dependency source, or an unexpected metadata failure. These are
          # wrong wherever the tree came from, so they fail the build.
          case "$summary" in
            *failures=0*) echo "license classification: clean across $resolved workspace roots" ;;
            *) echo "::error::SBOM reports classification failures — see FAILURE lines above"; exit 1 ;;
          esac

          # The report: drift and unresolvable manifests. Expected on a
          # vendored snapshot that lags its source of truth. Surfaced loudly,
          # never used to fail the build here — it is gated in the live tree.
          case "$summary" in
            *drift=True*) echo "::warning::committed SBOM.md/NOTICES.md differ from a fresh run — expected while the dclutch/ subtree lags; regenerate in the live tree" ;;
          esac
          case "$summary" in
            *unresolvable=0*) ;;
            *) echo "::warning::one or more mini-workspaces have a stale Cargo.lock (see UNRESOLVABLE lines); a reproducibility gap owed to the owning lane, not a license question" ;;
          esac
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM classification logic tests
        working-directory: dclutch
        run: python3 -m unittest tools.sbom.test_sbom_check -v

      # A SECURITY.md is the one page where a wrong address is worse than no
      # address: a report sent to a mailbox nobody reads is a report that was
      # never made. So an unconfirmed contact placeholder must never reach a
      # published tree, and this refuses rather than warns. It names exactly
      # one human action and clears the moment that action is taken.
      - name: Security contact is real
        run: |
          hits=$(grep -rl 'EMBER-CONFIRMS' --include=SECURITY.md . || true)
          if [ -n "$hits" ]; then
            echo "::error::SECURITY.md still carries an unconfirmed contact placeholder:"
            echo "$hits"
            echo "Replace EMBER-CONFIRMS-CONTACT-ADDRESS with the confirmed reporting address."
            exit 1
          fi
          echo "no unconfirmed contact placeholders"

      # The two steps below check for their tool before running it. That is
      # not defensive padding: these tools exist in the live tree and reach
      # this repository only when the subtree is refreshed, so "absent" is a
      # true and useful statement about what is published right now, and a
      # different fact from "failed". Both are reported; neither absence
      # fails the build.
      - name: Lean emission census
        working-directory: dclutch
        run: |
          if [ -f tools/emission-guard/emission_guard.py ]; then
            python3 tools/emission-guard/emission_guard.py --verify
          else
            echo "::warning::tools/emission-guard is not in the published subtree yet — refresh the subtree to gate the generated-file census here"
          fi

      - name: Seam audit
        working-directory: dclutch
        run: |
          if [ -f tools/seam-audit/seam_audit.py ]; then
            npm install --no-save --no-audit --no-fund @ast-grep/cli
            PATH="$PWD/node_modules/.bin:$PATH" python3 tools/seam-audit/seam_audit.py
          else
            echo "::warning::tools/seam-audit is not in the published subtree yet — refresh the subtree to gate the seam register here"
          fi

  # -------------------------------------------------------------------------
  # The release tooling's REFUSAL suites.
  #
  # `dclutch/tools/release/` decides whether a build may be released at all,
  # and four test scripts sit directly beside the tools they test. Nothing ran
  # any of them — no CI, no runner, no schedule, no hook. They are hermetic
  # (stub binaries on PATH, RPC pointed at `https://example.invalid`) and about
  # five seconds for all four, so they belong on the cheap lane and every push.
  #
  # What they gate is refusals: stale or forged build evidence must not be
  # admitted, and a market must not be founded at a fee rate that can never
  # trade or against a founder key nobody holds. Both irreversible. A refusal
  # test that never runs cannot be told apart from a tool that has quietly
  # stopped refusing.
  #
  # Like the Rust jobs this calls `tools/ci/run.sh` rather than listing the four
  # scripts here. One definition, two callers — a list in this file would be a
  # second inventory to keep in sync, and it would go stale silently.
  # -------------------------------------------------------------------------
  release:
    name: release tooling refusals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The stager suite re-runs two of its red controls against the last
          # revision BEFORE its guards existed — a control pinned to HEAD stops
          # discriminating the moment the fix lands. A depth-1 clone cannot give
          # it that. It degrades honestly and names the cases it skipped, but
          # history is cheap here and makes those two controls real.
          fetch-depth: 0

      - name: Is the release tier in the published subtree yet?
        id: probe
        run: |
          if [ -x dclutch/tools/ci/run.sh ] \
            && dclutch/tools/ci/run.sh --list 2>/dev/null | grep -q '^release '; then
            echo "present=1" >> "$GITHUB_OUTPUT"
          else
            echo "present=0" >> "$GITHUB_OUTPUT"
            echo "::warning::the release tier is not in the published subtree yet, so the four release-tooling refusal suites did NOT run. That is a statement about what is published, not about the live tree. Refresh the subtree to make this job real."
            echo "release tier: NOT RUN (not in the published subtree)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: the release-tooling refusal suites
        if: steps.probe.outputs.present == '1'
        working-directory: dclutch
        run: |
          set +e
          tools/ci/run.sh release
          code=$?
          set -e
          case "$code" in
            0) echo "release: passed" | tee -a "$GITHUB_STEP_SUMMARY" ;;
            2)
              echo "::warning::the release tier declined to run, or some of its suites are absent from this tree. Nothing was proven for the missing ones — an unrun refusal test is not a passing one."
              echo "release: NOT RUN (missing prerequisite)" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::a release-tooling REFUSAL suite failed. Each one proves the release machinery still says no to something irreversible: forged build evidence, a market founded at a fee rate that can never trade, a founder key nobody holds. Read the failing case before you change either side of it."
              echo "release: FAILED" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

  suites:
    name: web + SDK test suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            directory: dclutch/apps/dclutch-web
          - name: sdk
            directory: dclutch/packages/dclutch-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install
        working-directory: ${{ matrix.directory }}
        run: npm ci

      # WHY TWO FILES ARE EXCLUDED, since silently narrowing a suite is exactly
      # the sort of thing that should never pass without a reason:
      #
      #   lib/abiVerification.test.ts enumerates every `abi:*:verify` script
      #   out of package.json and runs it. Most are cheap. Four shell out to
      #   `lake build` — and by the suite's own deliberate design they FAIL
      #   rather than skip when lake is absent, because "an unverifiable ABI is
      #   not a verified one". Running them here would mean installing a Lean
      #   toolchain and paying a Lean build on every push. They run in the live
      #   tree, where the toolchain lives, via the pre-push emission guard.
      #
      #   lib/sbomVerify.test.ts runs the full SBOM closure, which needs a
      #   populated cargo registry and is gated in the `hygiene` job above on
      #   the terms that actually make sense for a vendored subtree.
      #
      # Everything else in both suites runs, unfiltered. The live-devnet tests
      # are already env-gated off by default and reach no network.
      #
      # ONE TEST IN THIS SUITE NEEDS RUST, AND IS NOT EXCLUDED FOR IT.
      # lib/sourceReadinessWasmParity.test.ts shells out to
      # `cargo run -p dclutch-source-readiness-operator --bin
      # source-readiness-parity` and asserts the generated WASM blob and the
      # native operator derive byte-identical coordinates. That is the gate
      # that stops the browser becoming its own authority for those wires, so
      # an unproven parity is not a parity and excluding it would be the
      # silent narrowing the block above exists to forbid.
      #
      # The toolchain is installed EXPLICITLY rather than left to
      # rust-toolchain.toml's implicit auto-install on first `cargo`. On
      # 2026-09-01 the implicit path failed on the runner with
      #   error: failed to install component: 'cargo-x86_64-unknown-linux-gnu',
      #   detected conflict: 'bin/cargo'
      # which reds the entire web suite for a reason that has nothing to do
      # with any code under test. Measured the same day: all four parity cases
      # pass in the live tree in about two seconds, so that red was
      # provisioning and never a parity break. This step is a CI-environment
      # repair and could not be reproduced off-runner; if it still conflicts,
      # the honest next move is to pin the runner's own toolchain via
      # RUSTUP_TOOLCHAIN for this step, NOT to exclude the test.
      - name: Rust toolchain (for the Source readiness parity test)
        if: matrix.name == 'web'
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Test
        working-directory: ${{ matrix.directory }}
        run: |
          npx vitest run --config vitest.config.ts \
            --exclude 'lib/abiVerification.test.ts' \
            --exclude 'lib/sbomVerify.test.ts'
